<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<title>SAIC Trésorerie</title>
<meta name="theme-color" content="#1f5c47">
<link rel="icon" href="../icons/saic-favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/saic-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: same shell as the SAIC farmer registry — left rail + work area; cash box page = tiles, balance chart | categories, table. */
:root{
  --paper:#f3f5f2; --surface:#ffffff; --ink:#1b2420; --muted:#5d6a63; --line:#d9dfd9;
  --accent:#1f5c47; --accent-soft:#e2eee8; --pod:#a8641a; --pod-soft:#f6ead9;
  --ok:#237a4b; --ok-bg:#e1f2e7; --warn:#9a6400; --warn-bg:#fbf0d9; --bad:#b3362c; --bad-bg:#fbe4e1;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
    --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
    --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
  --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
  --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px;font-weight:700} h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.9em} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.logo{display:block;width:180px;max-width:100%;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--paper)} .nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{background:var(--warn-bg);color:var(--warn);border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.rail-foot select{font-size:13px;padding:5px 8px}
.main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.topline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topline p{margin-top:4px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);font-size:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .l{font-size:13px;color:var(--muted)} .tile .s{font-size:12px;color:var(--muted)}
.v.ok{color:var(--ok)} .v.bad{color:var(--bad)} .v.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

/* cash box summary cards */
.box{display:flex;flex-direction:column;gap:12px}
.box-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.box-head .code{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.bal{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.bal small{font-size:15px;color:var(--muted);font-weight:500}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--paper);overflow:visible}
.gauge span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.gauge span.over{background:var(--bad)} .gauge span.low{background:var(--warn)}
.gauge i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gauge-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.kv3 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--accent-soft);color:var(--muted)}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:6px;border-left:3px solid}
.issues li.bad{background:var(--bad-bg);border-color:var(--bad)} .issues li.warn{background:var(--warn-bg);border-color:var(--warn)} .issues li.ok{background:var(--ok-bg);border-color:var(--ok)}
.issues li .who{font-size:12px;color:var(--muted);display:block}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--paper);border-radius:0 4px 4px 0;position:relative}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar-fill.pod{background:var(--pod)}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row .val small{color:var(--muted);margin-left:6px}
.bar-row:hover .bar-fill{filter:brightness(1.12)}

/* chart */
.chart-wrap{position:relative}
svg.chart{width:100%;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);fill-opacity:.08}
.chart .ceil{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ceil-l{fill:var(--bad);font-size:13px;font-weight:600}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.toolbar select{width:auto}
textarea{min-height:70px;resize:vertical}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap;font-size:12px}
td.in{color:var(--ok)}
tr.flag-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)} tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.flagtxt{font-size:12px;display:block;margin-top:2px} .flagtxt.bad{color:var(--bad)} .flagtxt.warn{color:var(--warn)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

/* requests */
.req{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.req .amt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.steps{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.step{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.step.now{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.step.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.req .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--pod-soft);color:var(--pod);text-transform:uppercase;letter-spacing:.04em}
.recon{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;align-items:center}
.recon .num{text-align:right}
.recon input{width:160px;text-align:right}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.drawer form{display:flex;flex-direction:column;min-height:100%}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.drawer header p{margin-top:2px;color:var(--muted);font-size:13px}
.drawer .body{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0} .f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.att-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.att-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.att-links{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.suggest{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:10px 12px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40}

@media (max-width:1050px){ .grid2,.grid-wide{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{width:120px} .brand span{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail-foot{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .main{padding:18px 16px 50px}
  .fgrid{grid-template-columns:1fr}
  .kv3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#overview"><img class="logo" id="brandLogo" alt="SAIC"><span id="brandSub"></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<div id="toastHost"></div>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "../js/config.js";
import { LOGO } from "../js/logo.js";
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";
document.getElementById("brandLogo").src = LOGO;
// each dashboard keeps its own sign-in (its own session), so one computer can be signed in to several dashboards with different accounts;
// the old /tresorerie address uses the shared SAIC Suite session only to find out where to send the person
const DASH = ["daf", "comptable", "caisse-cacao", "caisse-admin"].find(k => (location.pathname.split("/").filter(Boolean)[0] || "").toLowerCase() === k);
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, ...(DASH ? { storageKey: "saic-dash-" + DASH } : {}) } });
/* ---------- one page, four dashboards: the address decides which one (vercel.json rewrites them here) ---------- */
const APPS = {
  "daf": { roles: ["daf"], name: { fr: "Tableau de bord DAF", en: "DAF dashboard" } },
  "comptable": { roles: ["comptable"], name: { fr: "Tableau de bord Comptable", en: "Accounting dashboard" } },
  "caisse-cacao": { roles: ["caisse_cacao"], box: "cacao", name: { fr: "Caisse Achat Cacao", en: "Cocoa purchase cash box" } },
  "caisse-admin": { roles: ["caisse_admin"], box: "admin", name: { fr: "Caisse Administrative", en: "Administrative cash box" } }
};
const ROLE_APP = { daf: "daf", comptable: "comptable", caisse_cacao: "caisse-cacao", caisse_admin: "caisse-admin" };
const APP_KEY = (location.pathname.split("/").filter(Boolean)[0] || "").toLowerCase();
const APP = APPS[APP_KEY] || null;          // null on the old /tresorerie address: it sends each person to their own dashboard
const BOX = APP && APP.box || null;          // the cash box this dashboard works on (cash box managers only)
let DATA = { cacao: { opening: 0, from: "2026-01-01", to: "2026-01-01", rows: [] }, admin: { opening: 0, from: "2026-01-01", to: "2026-01-01", rows: [] } };

/* ---------- rules from the treasury manual (Manuel des procédures de trésorerie 2026/2027) ---------- */
const CAISSES = {
  cacao: { code: "COC", ceiling: 20000000, target: 20000000, name: { fr: "Caisse Achat Cacao", en: "Cocoa purchase cash box" },
    scope: ["Achat de cacao", "Manutention", "Usinage", "Frais de transport et ration", "Carburant", "Frais de mission", "Prestations MOON Ltd", "mains levées", "Approvisionnement DAF", "Retour en caisse"] },
  admin: { code: "CAD", ceiling: 500000, target: 500000, name: { fr: "Caisse Administrative", en: "Administrative cash box" }, scope: null }
};
const DG_THRESHOLD = 150000;          // §8.2: above this, an admin expense needs DG approval
const DUP_MIN = 50000;                // same amount in both cash boxes within 30 days → possible double payment
const LOW_SHARE = 0.10;               // closing balance below 10 % of target → replenish
const NATURES = {
  cacao: [["COC-001","Achat de cacao","Achat cacao magasin"],["COC-002","Achat de cacao","Achat cacao ramassage"],["COC-003","Achat de cacao","Achat exceptionnel de cacao"],
    ["COC-004","Avance fonds collecteurs","Avance fonds collecteurs"],["COC-005","Manutention","Manutention cacao"],["COC-006","Manutention","Chargement et déchargement"],
    ["COC-007","Prestations MOON Ltd","Transport cacao"],["COC-008","Location véhicule collecte","Location véhicule collecte"],["COC-009","Carburant","Carburant opérations cacao"],
    ["COC-010","Frais de transport et ration","Restauration équipes terrain"],["COC-011","Frais de mission","Hébergement / mission équipes terrain"],["COC-013","Frais de magasinage","Frais de magasinage"],
    ["COC-014","Usinage","Usinage / conditionnement"],["","mains levées","Main levée"]],
  admin: [["CAD-001","Fourniture et matériel","Fournitures de bureau"],["CAD-002","Fourniture et matériel","Consommables informatiques"],["CAD-003","Entretien magasin","Entretien locaux / magasin"],
    ["CAD-004","Entretien et réparation véhicule","Réparation véhicules et équipements"],["CAD-006","Eau et électricité","Eau"],["CAD-007","Eau et électricité","Électricité"],
    ["CAD-008","Internet et téléphone","Internet"],["CAD-009","Internet et téléphone","Téléphone / recharge"],["CAD-012","Frais de transport et ration","Déplacements administratifs, ration"],
    ["CAD-013","Frais de mission","Frais de mission"],["CAD-014","Honoraires prestataires","Honoraires prestataires"],["CAD-016","Sécurité et gardiennage","Sécurité et gardiennage"],
    ["CAD-019","Document administratif","Frais bancaires, timbres, documents"],["","Carburant","Carburant administratif"],["","Salaire","Salaires"],["","Commission","Commission"],
    ["","Main levée","Main levée"],["","Autre dépense","Autre dépense"]]
};
/* Approval matrix (manual §8 and annex A). Editable by the DAF and the DG; saved with the app. */
const APPROVERS = ["comptable", "daf", "dg"];
const OPS = ["expense", "asset", "topup_regular", "topup_exceptional"];
const DEFAULT_MATRIX = [
  { box: "cacao", op: "expense", min: 0, max: null, approvers: ["comptable", "dg"] },
  { box: "admin", op: "expense", min: 0, max: 150000, approvers: ["comptable"] },
  { box: "admin", op: "expense", min: 150001, max: null, approvers: ["comptable", "dg"] },
  { box: "admin", op: "asset", min: 0, max: 150000, approvers: ["comptable"] },
  { box: "admin", op: "asset", min: 150001, max: 299999, approvers: ["comptable", "dg"] },
  { box: "admin", op: "asset", min: 300000, max: 1000000, approvers: ["comptable", "daf", "dg"] },
  { box: "admin", op: "asset", min: 1000001, max: null, approvers: ["comptable", "daf", "dg"] },
  { box: "any", op: "topup_regular", min: 0, max: null, approvers: ["daf"] },
  { box: "any", op: "topup_exceptional", min: 0, max: null, approvers: ["daf", "dg"] }
];
function required(box, op, amount) {
  const m = S.matrix.find(r => (r.box === box || r.box === "any") && r.op === op && amount >= (r.min || 0) && (r.max === null || r.max === "" || amount <= r.max));
  return m ? APPROVERS.filter(a => m.approvers.includes(a)) : ["dg"];
}
const roleList = arr => arr.map(a => t("role_" + a)).join(" → ");
const INFLOWS = { cacao: ["Approvisionnement DAF", "Retour en caisse"], admin: ["Approvisionnement", "Retour en caisse"] };

const NAME_FIX = {};  // display name per normalised name (first spelling seen)
function analyse(key) {

  const added = S.entries.filter(e => e.caisse === key).sort((x, y) => (x.date + x.created).localeCompare(y.date + y.created)).map(e => ({ ...e, added: true }));
  const merged = [...base.rows.map((r, i) => ({ ...r, _o: i })), ...added.map((r, i) => ({ ...r, _o: 1e5 + i }))].sort((x, y) => x.date === y.date ? x._o - y._o : x.date.localeCompare(y.date));
  const d = { ...base, rows: merged, to: merged.reduce((m, r) => r.date > m ? r.date : m, base.to) };
  let bal = d.opening; const rows = [];
  for (const r of d.rows) { bal += r.in - r.out; rows.push({ ...r, cat: normCat(r.cat), bal, flags: [] }); }
  const totIn = rows.reduce((a, r) => a + r.in, 0), totOut = rows.reduce((a, r) => a + r.out, 0);
  const supply = rows.filter(r => r.in && !/retour/i.test(r.cat)).reduce((a, r) => a + r.in, 0), returns = totIn - supply;
  // end-of-day balances
  const days = []; for (const r of rows) { if (days.length && days[days.length - 1].date === r.date) days[days.length - 1].bal = r.bal; else days.push({ date: r.date, bal: r.bal }); }
  const over = days.filter(x => x.bal > c.ceiling), maxDay = days.reduce((m, x) => x.bal > m.bal ? x : m, { bal: d.opening, date: d.from });
  // categories (cash out)
  const cats = {}; for (const r of rows) if (r.out) cats[r.cat] = (cats[r.cat] || 0) + r.out;
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);

  const burn = totOut / span;

  const other = key === "cacao" ? "admin" : "cacao";
  for (const r of rows) {
    if (r.out && !r.ref) r.flags.push({ lv: "warn", m: t("f_noref") });
    if (r.in && /retour/i.test(r.cat) && !r.ref) r.flags.push({ lv: "warn", m: t("f_noreceipt") });
    if (r.out > c.ceiling) r.flags.push({ lv: "warn", m: t("f_single_over", { a: fc(r.out), c: fc(c.ceiling) }) });
    if (r.added && r.out && (!r.proof || r.proof === "none") && !(r.files || []).length) r.flags.push({ lv: "warn", m: t("f_noproof") });
    if (r.added && r.out) { const req = required(key, r.asset ? "asset" : "expense", r.out), miss = req.filter(x => !(r.approvals || []).includes(x)); if (miss.length) r.flags.push({ lv: "bad", m: t("f_missing", { r: roleList(miss) }) }); }
    if (!r.added && r.out && key === "admin") { const req = required(key, "expense", r.out).filter(x => x !== "comptable"); if (req.length) r.flags.push({ lv: "warn", m: t("f_check_appr", { r: roleList(req), a: fc(r.out) }) }); }
    if (c.scope && r.out && !NATURES[key].some(n => n[1].toLowerCase() === r.cat.toLowerCase()) && !c.scope.some(s => s.toLowerCase() === r.cat.toLowerCase())) r.flags.push({ lv: "bad", m: t("f_scope", { c: r.cat }) });
    if (key === "cacao" && r.out && (/^DG$/i.test(r.party) || /\bPDG\b/.test(r.details))) r.flags.push({ lv: "warn", m: t("f_direction") });
    if (r.out >= DUP_MIN) for (const o of [...DATA[other].rows, ...S.entries.filter(e => e.caisse === other)]) {
      if (o.out === r.out && Math.abs(new Date(o.date) - new Date(r.date)) <= 30 * 864e5) r.flags.push({ lv: "warn", m: t("f_dup", { a: fc(r.out), o: cname(other), d: dfull(o.date) }) });
    }
  }
  // cocoa specifics

    const pur = rows.filter(r => r.out && /achat de cacao/i.test(r.cat));
    const purchases = pur.reduce((a, r) => a + r.out, 0);
    const byType = {}; for (const r of pur) { const k = PURCHASE_TYPES[(r.ref || "").slice(0, 7)] || "autre"; byType[k] = (byType[k] || 0) + r.out; }
    const byBuyer = {}; for (const r of pur) { const k = normName(r.party); NAME_FIX[k] ||= r.party; byBuyer[k] = (byBuyer[k] || 0) + r.out; }
    const opexRows = rows.filter(r => r.out && !/achat de cacao/i.test(r.cat));
    const opex = opexRows.reduce((a, r) => a + r.out, 0);
    // ramassage advances returned
    for (const r of rows) if (r.in && /retour/i.test(r.cat) && /^COC-002/.test(r.ref)) r.flags.push({ lv: "warn", m: t("f_ramassage", { a: fc(r.in), d: dfull(r.date) }) });
    extra = { purchases, byType: Object.entries(byType).sort((a, b) => b[1] - a[1]), byBuyer: Object.entries(byBuyer).sort((a, b) => b[1] - a[1]), opex, nPur: pur.length };
  } else {
    const le = rows.filter(r => r.out && r.out <= DG_THRESHOLD), gt = rows.filter(r => r.out > DG_THRESHOLD);
    extra = { le: [le.length, le.reduce((a, r) => a + r.out, 0)], gt: [gt.length, gt.reduce((a, r) => a + r.out, 0)] };

}

/* ---------- charts ---------- */
function balanceChart(a) {
  const W = 760, H = 280, L = 64, R = 16, T = 18, B = 30;
  const pts = [{ date: a.d.from, bal: a.d.opening }, ...a.days];
  const t0 = new Date(a.d.from).getTime(), t1 = new Date(a.d.to).getTime();
  const X = iso => L + (new Date(iso).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const maxV = Math.max(a.c.ceiling, ...pts.map(p => p.bal)) * 1.08;
  const Y = v => T + (1 - v / maxV) * (H - T - B);
  const ticks = []; const stepRaw = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))); const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= stepRaw);
  for (let v = 0; v <= maxV; v += step) ticks.push(v);
  let path = "", px = null;
  for (const p of pts) { const x = X(p.date), y = Y(p.bal); path += px === null ? `M${x},${y}` : `H${x}V${y}`; px = x; }
  path += `H${X(a.d.to)}`;
  const area = path + `V${Y(0)}H${L}Z`;
  const xt = []; const d0 = new Date(a.d.from), d1 = new Date(a.d.to); const nd = Math.round((d1 - d0) / 864e5); const every = nd > 20 ? 7 : nd > 10 ? 3 : 1;
  for (let i = 0; i <= nd; i += every) { const dd = new Date(d0.getTime() + i * 864e5).toISOString().slice(0, 10); xt.push(dd); }
  const last = pts[pts.length - 1];
  return `<div class="chart-wrap" data-chart="${a.key}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("bal_chart"))}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fcs(v)}</text>`).join("")}
    ${xt.map(dd => `<text class="axis" x="${X(dd)}" y="${H - 8}" text-anchor="middle">${dfmt(dd)}</text>`).join("")}
    <path class="area" d="${area}"/><path class="line" d="${path}"/>
    <line class="ceil" x1="${L}" x2="${W - R}" y1="${Y(a.c.ceiling)}" y2="${Y(a.c.ceiling)}"/>
    <text class="ceil-l" x="${W - R}" y="${Y(a.c.ceiling) - 6}" text-anchor="end">${esc(t("ceiling"))} ${fcs(a.c.ceiling)}</text>
    <circle class="dot" cx="${X(a.d.to)}" cy="${Y(last.bal)}" r="5"/>
    <line class="xh" id="xh-${a.key}" y1="${T}" y2="${H - B}" x1="-10" x2="-10"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" data-hit="${a.key}"/>
  </svg><div class="tip" id="tip-${a.key}" hidden></div></div>`;
}
function bindChart(a) {
  const wrap = document.querySelector(`[data-chart="${a.key}"]`); if (!wrap) return;
  const svg = wrap.querySelector("svg"), hit = wrap.querySelector("[data-hit]"), tip = wrap.querySelector(".tip"), xh = wrap.querySelector(".xh");
  const W = 760, L = 64, R = 16, t0 = new Date(a.d.from).getTime(), t1 = new Date(a.d.to).getTime();
  const pts = [{ date: a.d.from, bal: a.d.opening }, ...a.days];
  const move = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
    const tt = t0 + (vx - L) / (W - L - R) * (t1 - t0);
    let p = pts[0]; for (const q of pts) if (new Date(q.date).getTime() <= tt + 432e5) p = q;
    const day = new Date(Math.min(Math.max(tt, t0), t1)).toISOString().slice(0, 10);
    xh.setAttribute("x1", vx); xh.setAttribute("x2", vx);
    tip.hidden = false; tip.style.left = (e.clientX - wrap.getBoundingClientRect().left) + "px"; tip.style.top = (e.clientY - wrap.getBoundingClientRect().top) + "px";
    tip.textContent = `${dfull(day)} · ${t("balance")} ${fc(p.bal)}`;
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("x1", -10); xh.setAttribute("x2", -10); });
}

// workflow from §7: courant → DAF → Trésorier ; exceptionnel → DAF → DG → Trésorier
// the approval chain is taken from the matrix when the request is submitted, then kept with the request
const reqFlow = r => r.flow || (r.type === "exceptionnel" ? ["daf", "dg"] : ["daf"]);
function nextActor(r) {
  if (r.status === "funded" || r.status === "rejected") return null;
  const f = reqFlow(r), i = r.status === "submitted" ? -1 : f.indexOf(r.status);
  return i + 1 < f.length ? f[i + 1] : "tresorier";
}
function reqCard(r) {
  const flow = ["submitted", ...reqFlow(r), "funded"], idx = flow.indexOf(r.status);
  const stepName = { submitted: t("s_submit"), comptable: t("role_comptable"), daf: t("s_daf"), dg: t("s_dg"), funded: t("s_fund") };
  const steps = flow.map((s, i) => { let cls = i <= idx ? "done" : i === idx + 1 && r.status !== "rejected" ? "now" : ""; if (r.status === "rejected" && i === (r.rejectedAt ?? 1)) cls = "no"; return `<span class="step ${cls}">${esc(stepName[s])}</span>`; }).join("");
  const actor = nextActor(r);
  const mine = actor && (actor === S.role || (actor === "tresorier" && S.role === "daf"));
  const own = r.createdBy === S.me.id && actor;
  const stLabel = r.status === "submitted" ? t("st_submitted") : r.status === "daf" ? t("st_daf") : r.status === "dg" ? t("st_dg") : r.status === "comptable" ? t("role_comptable") + " ✓" : r.status === "funded" ? t("st_funded") : t("st_rejected");
  const stCls = r.status === "funded" ? "ok" : r.status === "rejected" ? "bad" : "warn";
  return `<div class="req">
    <div><div class="row"><b class="mono">${esc(r.id)}</b><span class="pill ${stCls}">${esc(stLabel)}</span>${r.example ? `<span class="tag">${esc(t("example"))}</span>` : ""}</div>

      <div class="small muted">${esc(S.people[r.createdBy] || t("role_comptable"))} · ${dfull(r.date)}${r.need ? " · " + esc(t("f_need")) + " " + dfull(r.need) : ""}${r.bankRef ? " · " + esc(r.bankRef) : ""}${r.rejectReason ? " · " + esc(r.rejectReason) : ""}</div>${fileLinks(r.files)}</div>
    <div class="amt">${fc(r.amount)}</div>
    <div class="steps">${steps}</div>
    ${actor ? `<div class="acts">${own ? `<span class="small muted">${esc(t("own_request"))}</span>` : mine ? (actor === "tresorier" ? `<button class="btn primary small" data-act="fund" data-id="${esc(r.id)}">${esc(t("act_fund"))}</button>` : `<button class="btn primary small" data-act="approve" data-id="${esc(r.id)}">${esc(t("act_approve"))}</button>`) + `<button class="btn small danger" data-act="reject" data-id="${esc(r.id)}">${esc(t("act_reject"))}</button>` : `<span class="small muted">${esc(t("waiting_for", { r: t("role_" + (actor === "tresorier" ? "daf" : actor)) }))}</span>`}</div>` : ""}

    <ul class="att-list" id="attList"></ul></div>`;

function bindAttach() {
  const draw = () => { const l = $("#attList"); if (!l) return;
    l.innerHTML = [...attKeep.map((f, i) => `<li><a href="#" data-file="${esc(f.path)}">${esc(f.name)}</a><button type="button" class="btn small" data-attk="${i}">${esc(t("att_remove"))}</button></li>`),
      ...attNew.map((f, i) => `<li><span>${esc(f.name)} <span class="muted small">(${Math.round(f.size / 1024)} Ko)</span></span><button type="button" class="btn small" data-attn="${i}">${esc(t("att_remove"))}</button></li>`)].join("");
    l.querySelectorAll("[data-attk]").forEach(b => b.onclick = () => { attKeep.splice(+b.dataset.attk, 1); draw(); });

function toJpeg(file, max = 2000, q = 0.85) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("image")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error(t("att_type"))); }; img.src = u; });
}
async function uploadAttachments(errEl) {
  const out = attKeep.slice();
  if (!attNew.length) return out;
  errEl.textContent = t("att_uploading"); errEl.style.color = "var(--muted)";
  for (const f of attNew) {
    try {
      let blob = f, type = f.type, name = f.name;
      if (/^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name)) { if (f.size > 1.5e6 || !/^image\/(jpeg|png|webp)$/.test(f.type)) { blob = await toJpeg(f); type = "image/jpeg"; name = name.replace(/\.\w+$/, "") + ".jpg"; } }
      else if (f.type !== "application/pdf") throw new Error(t("att_type"));
      const path = `${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}-${name.replace(/[^\w.\-]+/g, "_")}`;
      const { error } = await sb.storage.from("treasury-files").upload(path, blob, { contentType: type, upsert: false });
      if (error) throw new Error(error.message);
      out.push({ path, name, type, size: blob.size });
    } catch (e) { errEl.style.color = ""; throw new Error(t("att_fail", { n: f.name, m: e.message || e.code })); }
  }
  errEl.textContent = ""; errEl.style.color = "";
  return out;
}

  <div class="card stack"><h3>${esc(t("by_cat_box"))}</h3>
    <div class="table-wrap"><table><thead><tr><th>${esc(t("c_cat"))}</th><th class="r">${esc(cname("cacao"))}</th><th class="r">${esc(cname("admin"))}</th><th class="r">${esc(t("both"))}</th><th style="width:30%"></th></tr></thead>
    <tbody>${piv.map(r => `<tr class="pick" data-cat="${esc(r[0])}" style="cursor:pointer"><td>${esc(r[0])}</td><td class="r num">${r[1] ? fc(r[1]) : "—"}</td><td class="r num">${r[2] ? fc(r[2]) : "—"}</td><td class="r num"><b>${fc(r[3])}</b></td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${r[3] / Math.max(piv[0] ? piv[0][3] : 1, 1) * 100}%"></div></div></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>${esc(t("total"))}</td><td class="r num">${fc(tot[0])}</td><td class="r num">${fc(tot[1])}</td><td class="r num">${fc(tot[2])}</td><td></td></tr></tfoot></table></div></div>
  <div class="card stack"><h3>${esc(t("transactions"))} (${list.length} · ${fc(sum)})</h3>
    <div class="table-wrap"><table><thead><tr><th>${esc(t("c_date"))}</th><th>${esc(t("c_box"))}</th><th>${esc(t("c_ref"))}</th><th>${esc(t("c_cat"))}</th><th>${esc(t("c_details"))}</th><th class="r">${esc(t("c_out"))}</th></tr></thead>
    <tbody>${list.map(r => { const lv = r.flags.some(x => x.lv === "bad") ? "bad" : r.flags.length ? "warn" : ""; return `<tr class="${lv ? "flag-" + lv : ""}"><td class="num">${dfull(r.date)}</td><td>${esc(CAISSES[r.box].code)}</td>
      <td class="mono">${esc(r.ref || "—")}${r.added ? `<br><span class="tag">${esc(t("added"))}</span>${S.editedIds.has(r.id) ? ` <span class="tag" style="background:var(--warn-bg);color:var(--warn)">${esc(t("edited"))}</span>` : ""}` : ""}${S.role === "comptable" && r.id ? ` <button class="btn small" data-act="ask" data-id="${esc(r.id)}" data-caisse="${r.box}">${esc(t("ask"))}</button>` : ""}</td><td>${esc(r.cat)}</td>
      <td>${esc(r.details)}${fileLinks(r.files)}${r.party ? `<span class="flagtxt" style="color:var(--muted)">${esc(r.party)}</span>` : ""}${r.flags.map(x => `<span class="flagtxt ${x.lv}">${esc(x.m)}</span>`).join("")}</td><td class="r num">${fc(r.out)}</td></tr>`; }).join("")}</tbody></table></div></div>`;

function actOn(id, action) {
  const r = JSON.parse(JSON.stringify(S.requests.find(x => x.id === id)));
  const finish = async extra => { try { await stepReq(r.id, extra); closeModal(); toast(extra.status === "funded" ? t("funded_entry", { id: r.id, c: cname(r.caisse) }) : t("saved")); } catch (x) { closeModal(); toast(t("save_err", { m: x.message })); } };
  if (action === "approve") { finish({ status: S.role }); return; }
  const isFund = action === "fund";
  modal(`<form id="af"><header><div><h2>${esc(isFund ? t("act_fund") : t("act_reject"))}</h2><p class="mono">${esc(r.id)} · ${fc(r.amount)}</p></div><button type="button" class="btn" data-close>${esc(t("close"))}</button></header>

  $("#ax").focus();
  $("#af").onsubmit = e => { e.preventDefault(); const v = $("#ax").value.trim(); if (!v) { $("#afErr").textContent = "—"; return; }

}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const defBox = b.dataset.caisse || (["cacao", "admin"].includes(route()) ? route() : S.ex.box || "cacao");
  if (["newReq", "newEntry", "editEntry"].includes(b.dataset.act) && !canWrite()) { toast(t("only_box")); return; }
  if (b.dataset.act === "ask") { openAsk(b.dataset.caisse || "", b.dataset.id || ""); return; }
  if (b.dataset.act === "reply") { openReply(Number(b.dataset.q)); return; }
  if (b.dataset.act === "ceiling") { openCeiling(b.dataset.caisse); return; }
  if (b.dataset.act === "newReq") openRequestForm(defBox);
  else if (b.dataset.act === "newEntry") openEntryForm(defBox);
  else if (b.dataset.act === "editEntry") openEntryForm(null, b.dataset.id);
  else actOn(b.dataset.id, b.dataset.act);
});

  if (S.role !== "daf") return;
  modal(`<form id="cf"><header><div><h2>${esc(t("ceil_edit"))}</h2><p>${esc(cname(k))} · ${esc(t("ceiling"))} ${fc(CAISSES[k].ceiling)}</p></div><button type="button" class="btn" data-close>${esc(t("close"))}</button></header>
    <div class="body"><div class="fgrid"><div class="f"><label for="cv">${esc(t("ceil_new"))}</label><input id="cv" type="number" min="0" step="1000" value="${CAISSES[k].ceiling}"></div>
      <div class="f full"><label for="cw">${esc(t("edit_reason"))}</label><input id="cw" type="text" required><span class="hint">${esc(t("edit_reason_hint"))}</span></div></div></div>
    <footer><span class="err" id="cfErr"></span><div class="row"><button type="button" class="btn" data-close>${esc(t("cancel"))}</button><button class="btn primary" type="submit">${esc(t("save"))}</button></div></footer></form>`);
  $("#cf").onsubmit = async e => { e.preventDefault(); const v = Number($("#cv").value), why = $("#cw").value.trim();
    if (!(v > 0)) { $("#cfErr").textContent = t("ceil_new"); return; } if (!why) { $("#cfErr").textContent = t("need_reason"); return; }
    const { error } = await sb.from("cash_boxes").update({ ceiling: v, target: v, change_reason: why }).eq("id", k);
    if (error) { $("#cfErr").textContent = t("save_err", { m: error.message }); return; }
    closeModal(); toast(t("ceil_saved")); await loadData(); };
}
/* ---------- change history ---------- */
const H_LABEL = { amount: "e_amount", ceiling: "ceiling", target: "ceiling", details: "e_details", date: "e_date", cat: "c_cat", party: "e_party", ref: "e_ref", proof: "e_proof", kind: "e_kind", market: "e_market", approvals: "e_approved", code: "e_nature", opening: "opening" };
const H_SKIP = ["edit_reason", "change_reason", "updated_at", "updated_by", "files"];
const hval = (k, v) => v === null || v === undefined || v === "" ? "—" : ["amount", "ceiling", "target", "opening"].includes(k) ? fc(Number(v)) : typeof v === "object" ? JSON.stringify(v) : String(v);
function viewHistory() {
  const rows = S.log.map(l => { const c = l.changes || {}, isBox = l.table_name === "cash_boxes", tx = !isBox && S.txById && S.txById[l.record_id];
    const what = isBox ? cname(l.record_id) + " · " + t("ceiling") : tx ? `${cname(tx.caisse)} · ${tx.ref || ""} ${tx.details}` : l.record_id;
    const reason = (c.edit_reason || c.change_reason || c.void_reason || [])[1] || "";
    const change = c.voided ? t("h_void") : Object.entries(c).filter(([k]) => !H_SKIP.includes(k)).map(([k, v]) => `${H_LABEL[k] ? t(H_LABEL[k]) : k} : ${hval(k, v[0])} → ${hval(k, v[1])}`).join(" · ");
    return { when: l.changed_at, who: S.people[l.changed_by] || "—", what, change, reason }; }).filter(r => r.change);
  return `<div class="topline"><div><h1>${esc(t("h_title"))}</h1><p>${esc(t("h_sub"))}</p></div></div>
  ${rows.length ? `<div class="card"><div class="table-wrap"><table><thead><tr><th>${esc(t("h_when"))}</th><th>${esc(t("h_who"))}</th><th>${esc(t("h_what"))}</th><th>${esc(t("h_change"))}</th><th>${esc(t("h_reason"))}</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="num">${dfull(r.when.slice(0, 10))}</td><td>${esc(r.who)}</td><td>${esc(r.what)}</td><td>${esc(r.change)}</td><td>${esc(r.reason)}</td></tr>`).join("")}</tbody></table></div></div>`
    : `<div class="card muted">${esc(t("h_none"))}</div>`}`;
}

/* ---------- login ---------- */
function viewLogin() {
  return `<div class="card stack" style="max-width:400px;margin:8vh auto 0;width:100%"><img src="${LOGO}" alt="SAIC" style="width:240px;max-width:100%;margin:0 auto 6px;display:block">
    <div><h1>${esc(APP ? APP.name[S.lang] : t("signin"))}</h1><p class="muted">${esc(t("signin"))} · ${esc(t("signin_sub"))}</p></div>
    <form id="lf" class="stack" novalidate>
      <div class="f"><label for="lem">${esc(t("email"))}</label><input id="lem" type="email" autocomplete="username" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px"></div>
      <div class="f"><label for="lpw">${esc(t("password"))}</label><input id="lpw" type="password" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px"></div>
      <span class="err" id="lErr"></span><button class="btn primary" type="submit" id="lBtn">${esc(t("signin_btn"))}</button><a href="#" id="lForgot">${esc(t("forgot"))}</a></form><p class="privacy-link" style="font-size:13px;text-align:center;color:var(--muted);margin:0"><a href="/confidentialite/" style="color:inherit">${document.documentElement.lang === "en" ? "Privacy policy" : "Politique de confidentialité"}</a> · <a href="/conditions/" style="color:inherit">${document.documentElement.lang === "en" ? "Terms of use" : "Conditions d'utilisation"}</a></p></div>`;
}
function bindLogin() {
  $("#lf").onsubmit = async e => { e.preventDefault(); $("#lBtn").disabled = true; $("#lErr").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
    if (error) { $("#lErr").textContent = /invalid/i.test(error.message) ? t("bad_login") : error.message; $("#lBtn").disabled = false; return; }
    await boot(); };
  $("#lForgot").onclick = async e => { e.preventDefault(); const em = $("#lem").value.trim(); if (!em) { $("#lErr").textContent = t("enter_email"); return; }
    await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + "/" }); $("#lErr").textContent = t("reset_sent"); };
}

/* ---------- team (roles managed by the DAF) ---------- */
function viewTeam() {
  const isDaf = S.role === "daf";
  const roleOf = id => (S.members.find(m => m.user_id === id) || {}).role || "";
  return `<div class="topline"><div><h1>${esc(t("nav_team"))}</h1><p>${esc(t("team_sub"))}</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>${esc(t("team_name"))}</th><th>${esc(t("team_role"))}</th></tr></thead><tbody>
  ${Object.entries(S.people).sort((a, b) => a[1].localeCompare(b[1])).map(([id, name]) => `<tr><td>${esc(name)} ${id === S.me.id ? `<span class="muted">(${esc(t("you"))})</span>` : ""}</td>
    <td>${isDaf && id !== S.me.id ? `<select data-member="${esc(id)}" aria-label="${esc(t("team_role"))}" style="width:auto"><option value="">${esc(t("team_none"))}</option>${["caisse_cacao", "caisse_admin", "comptable", "daf", "dg", "tresorier", "viewer"].map(r => `<option value="${r}" ${roleOf(id) === r ? "selected" : ""}>${esc(t("role_" + r))}</option>`).join("")}</select>`
      : esc(roleOf(id) ? t("role_" + roleOf(id)) : t("team_none"))}</td></tr>`).join("")}</tbody></table></div>`;
}
function bindTeam() {
  document.querySelectorAll("[data-member]").forEach(sel => sel.onchange = async () => {
    const role = sel.value;
    const { error } = role ? await sb.from("treasury_members").upsert({ user_id: sel.dataset.member, role, updated_at: new Date().toISOString() })
      : await sb.from("treasury_members").delete().eq("user_id", sel.dataset.member);
    if (error) toast(t("save_err", { m: error.message })); else { await loadData(); toast(t("saved")); }
  });
}

/* ---------- data from Supabase ---------- */
async function loadData() {
  try {
    const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
    const [boxes, tx, reqs, people, members] = await Promise.all([
      sb.from("cash_boxes").select("*").then(must),
      sb.from("cash_transactions").select("*").eq("voided", false).order("date").order("seq").limit(10000).then(must),
      sb.from("fund_requests").select("*").order("created_at", { ascending: false }).then(must),
      sb.from("profiles").select("id, full_name").then(must),
      sb.from("treasury_members").select("*").then(must)
    ]);
    S.people = Object.fromEntries(people.map(p => [p.id, p.full_name || "—"]));
    S.members = members;
    const nd = {};
    for (const b of boxes) {
      CAISSES[b.id].ceiling = Number(b.ceiling); CAISSES[b.id].target = Number(b.target); CAISSES[b.id].code = b.code;
      const imp = tx.filter(r => r.caisse === b.id && r.source === "import");
      nd[b.id] = { opening: Number(b.opening), from: b.start_date, to: imp.reduce((m, r) => r.date > m ? r.date : m, b.start_date),
        rows: imp.map(r => ({ id: r.id, date: r.date, ref: r.ref || "", market: r.market || "", party: r.party || "", cat: r.cat, details: r.details, out: r.kind === "out" ? Number(r.amount) : 0, in: r.kind === "in" ? Number(r.amount) : 0, obs: r.obs || "" })) };
    }
    DATA = { ...DATA, ...nd };
    S.entries = tx.filter(r => r.source !== "import").map(r => ({ id: r.id, caisse: r.caisse, kind: r.kind, date: r.date, cat: r.cat, code: r.code || "", amount: Number(r.amount),
      out: r.kind === "out" ? Number(r.amount) : 0, in: r.kind === "in" ? Number(r.amount) : 0, party: r.party || "", market: r.market || "", details: r.details, ref: r.ref || "",
      proof: r.proof || "", approvals: r.approvals || [], asset: r.asset, files: r.files || [], obs: r.obs || "", created: r.created_at, source: r.source }));
    S.requests = reqs.map(r => ({ id: r.id, caisse: r.caisse, type: r.type, amount: Number(r.amount), reason: r.reason, details: r.details || "", need: r.need || "", files: r.files || [],
      flow: r.flow, status: r.status, bankRef: r.bank_ref || "", rejectReason: r.reject_reason || "", rejectedAt: r.rejected_at, history: r.history, createdBy: r.created_by,
      created: r.created_at, date: r.created_at.slice(0, 10) }));
    // questions and change history: optional, so the page still works before the database update
    const [qs, lg] = await Promise.all([
      sb.from("treasury_questions").select("*").order("asked_at", { ascending: false }).limit(500),
      sb.from("treasury_log").select("*").eq("action", "updated").in("table_name", ["cash_transactions", "cash_boxes"]).order("changed_at", { ascending: false }).limit(500)]);
    S.qOk = !qs.error; S.questions = qs.error ? [] : qs.data;
    S.log = lg.error ? [] : lg.data;
    S.editedIds = new Set(S.log.filter(l => l.table_name === "cash_transactions" && !(l.changes && l.changes.voided)).map(l => l.record_id));
    S.txById = Object.fromEntries(tx.map(r => [r.id, r]));
    S.loadError = "";
  } catch (e) { S.loadError = e.message; }
  recompute(); render();
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; S.ready = true; if (!APP) { location.replace("/suite/"); return; } render(); return; }
  const user = session.user;
  const [{ data: prof }, { data: mem }] = await Promise.all([
    sb.from("profiles").select("full_name").eq("id", user.id).maybeSingle(),
    sb.from("treasury_members").select("role").eq("user_id", user.id).maybeSingle()]);
  S.me = { id: user.id, email: user.email, name: (prof && prof.full_name) || user.email };
  S.role = mem ? mem.role : null;
  S.ready = true;
  if (!APP) { location.replace(S.role && ROLE_APP[S.role] ? "/" + ROLE_APP[S.role] + "/" : "/suite/"); return; }
  if (S.role) await loadData(); else render();
}
recompute(); render(); boot();
</script>
<script type="module" src="../js/abi.js"></script>
</body>
