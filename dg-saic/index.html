<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction Générale SAIC</title>
<meta name="theme-color" content="#1f5c47">
<link rel="icon" href="../icons/saic-favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/saic-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: same shell as the SAIC apps and the PDG dashboard — left rail + work area. */

/* Layout: same shell as the SAIC farmer registry — left rail + work area; cash box page = tiles, balance chart | categories, table. */
:root{
  --paper:#f3f5f2; --surface:#ffffff; --ink:#1b2420; --muted:#5d6a63; --line:#d9dfd9;
  --accent:#1f5c47; --accent-soft:#e2eee8; --pod:#a8641a; --pod-soft:#f6ead9;
  --ok:#237a4b; --ok-bg:#e1f2e7; --warn:#9a6400; --warn-bg:#fbf0d9; --bad:#b3362c; --bad-bg:#fbe4e1;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
    --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
    --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
  --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
  --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px;font-weight:700} h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.9em} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.logo{display:block;width:180px;max-width:100%;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--paper)} .nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{background:var(--warn-bg);color:var(--warn);border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.rail-foot select{font-size:13px;padding:5px 8px}
.main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.topline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topline p{margin-top:4px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);font-size:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .l{font-size:13px;color:var(--muted)} .tile .s{font-size:12px;color:var(--muted)}
.v.ok{color:var(--ok)} .v.bad{color:var(--bad)} .v.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

/* cash box summary cards */
.box{display:flex;flex-direction:column;gap:12px}
.box-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.box-head .code{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.bal{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.bal small{font-size:15px;color:var(--muted);font-weight:500}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--paper);overflow:visible}
.gauge span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.gauge span.over{background:var(--bad)} .gauge span.low{background:var(--warn)}
.gauge i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gauge-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.kv3 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--accent-soft);color:var(--muted)}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:6px;border-left:3px solid}
.issues li.bad{background:var(--bad-bg);border-color:var(--bad)} .issues li.warn{background:var(--warn-bg);border-color:var(--warn)} .issues li.ok{background:var(--ok-bg);border-color:var(--ok)}
.issues li .who{font-size:12px;color:var(--muted);display:block}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--paper);border-radius:0 4px 4px 0;position:relative}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar-fill.pod{background:var(--pod)}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row .val small{color:var(--muted);margin-left:6px}
.bar-row:hover .bar-fill{filter:brightness(1.12)}

/* chart */
.chart-wrap{position:relative}
svg.chart{width:100%;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);fill-opacity:.08}
.chart .ceil{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ceil-l{fill:var(--bad);font-size:13px;font-weight:600}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.toolbar select{width:auto}
textarea{min-height:70px;resize:vertical}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap;font-size:12px}
td.in{color:var(--ok)}
tr.flag-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)} tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.flagtxt{font-size:12px;display:block;margin-top:2px} .flagtxt.bad{color:var(--bad)} .flagtxt.warn{color:var(--warn)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

/* requests */
.req{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.req .amt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.steps{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.step{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.step.now{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.step.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.req .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--pod-soft);color:var(--pod);text-transform:uppercase;letter-spacing:.04em}
.recon{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;align-items:center}
.recon .num{text-align:right}
.recon input{width:160px;text-align:right}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.drawer form{display:flex;flex-direction:column;min-height:100%}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.drawer header p{margin-top:2px;color:var(--muted);font-size:13px}
.drawer .body{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0} .f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.att-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.att-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.att-links{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.suggest{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:10px 12px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40}

@media (max-width:1050px){ .grid2,.grid-wide{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{width:120px} .brand span{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail-foot{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .main{padding:18px 16px 50px}
  .fgrid{grid-template-columns:1fr}
  .kv3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* PDG dashboard additions — same shell as the SAIC apps; overview = KPI row, department cards grid, approvals | attention. */
.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.dept-grid{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.b-ok{background:var(--ok)} .b-pend{background:var(--muted);opacity:.45} .b-bad{background:var(--bad)}
.dept{display:flex;flex-direction:column;gap:12px}
.dept .ent{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dept .big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.dept .big small{font-size:14px;color:var(--muted);font-weight:500}
.dept .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who-row{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;align-items:center}
.who-row .n{font-variant-numeric:tabular-nums;text-align:right}
.ent-chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;letter-spacing:.04em}
.ent-chip.WHP{background:var(--accent-soft);color:var(--accent)} .ent-chip.SAIC{background:var(--pod-soft);color:var(--pod)}
.prio{font-size:11px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.05em}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.app-tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.app-tile:hover{border-color:var(--accent)}
.app-tile b{font-size:16px} .app-tile span{font-size:13px;color:var(--muted)}
.app-tile.soon{border-style:dashed;color:var(--muted)}
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.thread li{border-left:2px solid var(--line);padding-left:10px}
.thread .when{color:var(--muted)}
.req.clickable{cursor:pointer} .req.clickable:hover{border-color:var(--accent)}
.dkv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;font-size:14px}
.dkv dt{color:var(--muted);font-size:12px} .dkv dd{margin:0;font-weight:500}
.dtext{white-space:pre-wrap;line-height:1.6;background:var(--paper);border-radius:6px;padding:12px 14px;font-size:14px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);text-decoration:none;color:var(--ink)}
.file .thumb{height:110px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:18px;letter-spacing:.05em}
.file .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .fn{font-size:12px;padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file:hover{border-color:var(--accent)}
.statusbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--paper)}
.statusbar span{display:block;height:100%}
/* DG SAIC additions: SAIC palette (green / cocoa), SAIC Industries chip */
.rail{border-top:4px solid var(--pod)}
.ent-chip.IND{background:var(--accent-soft);color:var(--accent)}
.soon-card{border-style:dashed}
.logo.whp{width:120px;margin:0 auto}
@media (max-width:760px){.logo.whp{width:56px}}

</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#overview" aria-label="SAIC"><img class="logo" id="brandLogo" alt="SAIC"><span id="brandSub"></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<div id="toastHost"></div>

document.getElementById("brandLogo").src = BRAND;

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
let CASH = { cacao: { opening: 0, from: "2026-01-01", to: "2026-01-01", rows: [] }, admin: { opening: 0, from: "2026-01-01", to: "2026-01-01", rows: [] } };
let FARMERS = [];
let RECEP = { recs: [], sold: 0 };

const CEILINGS = { cacao: 20000000, admin: 500000 };

const STR = {
  fr: {

    signin: "Connexion", signin_sub: "Tableau de bord du groupe WHP", email: "E-mail", password: "Mot de passe", signin_btn: "Se connecter", bad_login: "E-mail ou mot de passe incorrect.", signout: "Se déconnecter",
    forgot: "Mot de passe oublié ?", reset_sent: "Si un compte existe pour cet e-mail, un lien de réinitialisation a été envoyé.", enter_email: "Saisissez d'abord votre e-mail.",
    no_access: "Ce tableau de bord est réservé au PDG et aux directions de WHP et de la SAIC. Demandez l'accès à l'administrateur.", loading: "Chargement…", load_err: "Chargement impossible : {m}", save_err: "Enregistrement impossible : {m}", r_none: "",

const S = { lang: (() => { try { const l = localStorage.getItem("saic-lang"); if (l === "en" || l === "fr") return l; } catch (e) {} return (navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr"; })(), role: null, me: null, ready: false, loadError: "", requests: [], dg: [], fund: [], team: [], people: [], staff: { entity: "cacao", department: "" }, flt: { st: "pending", ent: "", dept: "" } };
const t = (k, p = {}) => String((STR[S.lang][k] ?? STR.fr[k] ?? k)).replace(/\{(\w+)\}/g, (_, x) => p[x] ?? "");
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const loc = () => S.lang === "fr" ? "fr-FR" : "en-GB";
const fc = n => Math.round(n).toLocaleString(loc()).replace(/ /g, " ") + " F";
const fcs = n => { const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toLocaleString(loc(), { maximumFractionDigits: 1 }) + " M" : a >= 1e3 ? Math.round(n / 1e3).toLocaleString(loc()) + " k" : Math.round(n).toLocaleString(loc()); };
const dfmt = iso => new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short" });
const dfull = iso => new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" });
const dtime = iso => new Date(iso).toLocaleString(loc(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function toast(m) { $("#toastHost").innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("#toastHost").innerHTML = "", 3000); }
const statusPill = s => `<span class="pill ${s === "ok" ? "ok" : s === "watch" ? "warn" : "bad"}">${esc(t("st_" + s))}</span>`;

/* ---------- treasury summary (same rules as the SAIC treasury app) ---------- */
function cashBox(key) {
  const d = CASH[key], ceiling = CEILINGS[key];
  let bal = d.opening; const days = [];
  for (const r of d.rows) { bal += r.in - r.out; if (days.length && days[days.length - 1].date === r.date) days[days.length - 1].bal = bal; else days.push({ date: r.date, bal }); }
  const totIn = d.rows.reduce((a, r) => a + r.in, 0), totOut = d.rows.reduce((a, r) => a + r.out, 0), closing = d.opening + totIn - totOut;
  const cats = {}; for (const r of d.rows) if (r.out) { const c = r.cat.trim().replace(/\s+/g, " "); cats[c] = (cats[c] || 0) + r.out; }
  const over = days.filter(x => x.bal > ceiling), maxDay = days.reduce((m, x) => x.bal > m.bal ? x : m, { bal: d.opening, date: d.from });
  const span = Math.max(1, (new Date(d.to) - new Date(d.from)) / 864e5 + 1), burn = totOut / span;
  const status = closing > ceiling ? "bad" : closing < ceiling * 0.1 ? "bad" : over.length ? "watch" : "ok";
  return { key, d, c: { ceiling }, days, totIn, totOut, closing, cats: Object.entries(cats).sort((a, b) => b[1] - a[1]), over, maxDay, burn, status };
}
let CB = {};
const normName = n => String(n || "").toUpperCase().split(/[\s-]+/).filter(Boolean).sort().join(" ");
let cocoa; const computeCocoa = () => {
  const pur = CASH.cacao.rows.filter(r => r.out && /achat de cacao/i.test(r.cat));
  const total = pur.reduce((a, r) => a + r.out, 0), opex = CASH.cacao.rows.filter(r => r.out && !/achat de cacao/i.test(r.cat)).reduce((a, r) => a + r.out, 0);
  const by = {}, names = {}; for (const r of pur) { const k = normName(r.party); names[k] ||= r.party; by[k] = (by[k] || 0) + r.out; }
  return { total, opex, n: pur.length, byBuyer: Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => [names[k], v]) };
};

/* ---------- traceability summary ---------- */
let trace; const computeTrace = () => {
  const st = f => f.decision === "Approved" ? "verified" : (!f.idNumber || f.plots.some(p => !p.defoDate || !p.defoEvidence)) ? "hold" : "pending";
  const list = FARMERS.map(f => ({ f, s: st(f) }));
  const plots = FARMERS.flatMap(f => f.plots);
  const geo = plots.filter(p => (p.lat && p.lon) || (p.polygon && p.polygon.length > 2)).length;
  const ha = plots.reduce((a, p) => a + (Number(p.area) || 0), 0);
  const c = s => list.filter(x => x.s === s).length;
  return { list, n: FARMERS.length, verified: c("verified"), pending: c("pending"), hold: c("hold"), plots: plots.length, geo, ha };
};
function recompute() { CB = { cacao: cashBox("cacao"), admin: cashBox("admin") }; cocoa = computeCocoa(); trace = computeTrace(); }

/* ---------- alerts ---------- */
function alerts() {
  const out = [];
  for (const k of ["cacao", "admin"]) { const a = CB[k], nm = t("d_" + k);
    if (a.over.length) out.push({ lv: "warn", m: t("al_over", { c: nm, d: dfull(a.maxDay.date), v: fc(a.maxDay.bal) }), href: "#treasury" });
    if (a.closing < a.c.ceiling * 0.1) out.push({ lv: "bad", m: t("al_low", { c: nm, v: fc(a.closing) }), href: "#treasury" }); }
  const dup = CASH.cacao.rows.filter(r => r.out >= 50000 && CASH.admin.rows.some(o => o.out === r.out));
  for (const r of dup) out.push({ lv: "warn", m: t("al_dup", { a: fc(r.out) }), href: "#treasury" });
  const noref = CASH.cacao.rows.filter(r => r.out && !r.ref).length; if (noref) out.push({ lv: "warn", m: t("al_noref", { n: noref }), href: "#treasury" });
  const big = CASH.admin.rows.filter(r => r.out > 150000).length; if (big) out.push({ lv: "warn", m: t("al_big", { n: big }), href: "#treasury" });
  if (trace.hold) out.push({ lv: "bad", m: t("al_hold", { n: trace.hold }), href: "#trace" });
  return out.sort((a, b) => a.lv === b.lv ? 0 : a.lv === "bad" ? -1 : 1);
}

/* ---------- charts ---------- */
function balanceChart(a) {
  const W = 760, H = 280, L = 64, R = 16, T = 18, B = 30;
  const pts = [{ date: a.d.from, bal: a.d.opening }, ...a.days];
  const t0 = new Date(a.d.from).getTime(), t1 = new Date(a.d.to).getTime();
  const X = iso => L + (new Date(iso).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const maxV = Math.max(a.c.ceiling, ...pts.map(p => p.bal)) * 1.08;
  const Y = v => T + (1 - v / maxV) * (H - T - B);
  const ticks = []; const stepRaw = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))); const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= stepRaw);
  for (let v = 0; v <= maxV; v += step) ticks.push(v);
  let path = "", px = null;
  for (const p of pts) { const x = X(p.date), y = Y(p.bal); path += px === null ? `M${x},${y}` : `H${x}V${y}`; px = x; }
  path += `H${X(a.d.to)}`;
  const area = path + `V${Y(0)}H${L}Z`;
  const xt = []; const d0 = new Date(a.d.from), d1 = new Date(a.d.to); const nd = Math.round((d1 - d0) / 864e5); const every = nd > 20 ? 7 : nd > 10 ? 3 : 1;
  for (let i = 0; i <= nd; i += every) { const dd = new Date(d0.getTime() + i * 864e5).toISOString().slice(0, 10); xt.push(dd); }
  const last = pts[pts.length - 1];
  return `<div class="chart-wrap" data-chart="${a.key}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("bal_chart"))}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fcs(v)}</text>`).join("")}
    ${xt.map(dd => `<text class="axis" x="${X(dd)}" y="${H - 8}" text-anchor="middle">${dfmt(dd)}</text>`).join("")}
    <path class="area" d="${area}"/><path class="line" d="${path}"/>
    <line class="ceil" x1="${L}" x2="${W - R}" y1="${Y(a.c.ceiling)}" y2="${Y(a.c.ceiling)}"/>
    <text class="ceil-l" x="${W - R}" y="${Y(a.c.ceiling) - 6}" text-anchor="end">${esc(t("ceiling"))} ${fcs(a.c.ceiling)}</text>
    <circle class="dot" cx="${X(a.d.to)}" cy="${Y(last.bal)}" r="5"/>
    <line class="xh" id="xh-${a.key}" y1="${T}" y2="${H - B}" x1="-10" x2="-10"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" data-hit="${a.key}"/>
  </svg><div class="tip" id="tip-${a.key}" hidden></div></div>`;
}
function bindChart(a) {
  const wrap = document.querySelector(`[data-chart="${a.key}"]`); if (!wrap) return;
  const svg = wrap.querySelector("svg"), hit = wrap.querySelector("[data-hit]"), tip = wrap.querySelector(".tip"), xh = wrap.querySelector(".xh");
  const W = 760, L = 64, R = 16, t0 = new Date(a.d.from).getTime(), t1 = new Date(a.d.to).getTime();
  const pts = [{ date: a.d.from, bal: a.d.opening }, ...a.days];
  const move = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
    const tt = t0 + (vx - L) / (W - L - R) * (t1 - t0);
    let p = pts[0]; for (const q of pts) if (new Date(q.date).getTime() <= tt + 432e5) p = q;
    const day = new Date(Math.min(Math.max(tt, t0), t1)).toISOString().slice(0, 10);
    xh.setAttribute("x1", vx); xh.setAttribute("x2", vx);
    tip.hidden = false; tip.style.left = (e.clientX - wrap.getBoundingClientRect().left) + "px"; tip.style.top = (e.clientY - wrap.getBoundingClientRect().top) + "px";
    tip.textContent = `${dfull(day)} · ${t("balance")} ${fc(p.bal)}`;
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("x1", -10); xh.setAttribute("x2", -10); });
}
function bars(list, total, opt = {}) {
  const max = Math.max(...list.map(x => x[1]), 1);
  return `<div class="bars">${list.map(([k, v]) => `<div class="bar-row" title="${esc(opt.label ? opt.label(k) : k)} : ${fc(v)}"><span class="lab">${esc(opt.label ? opt.label(k) : k)}</span><span class="bar-track"><span class="bar-fill ${opt.cls || ""}" style="width:${v / max * 100}%"></span></span><span class="val">${fcs(v)}<small>${Math.round(v / total * 100)} %</small></span></div>`).join("")}</div>`;
}

const fn = (n, d = 0) => Number(n).toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/\u202f/g, "\u00a0");
const fkg = n => fn(n) + "\u00a0kg";
const weekKey = iso => { const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); };
function recStats() {
  const r = RECEP.recs, qty = r.reduce((a, x) => a + x.qty, 0), amount = r.reduce((a, x) => a + x.amount, 0);
  const traced = r.reduce((a, x) => a + (x.lines || []).reduce((s, l) => s + (Number(l.kg) || 0), 0), 0);
  const prices = r.map(x => x.qty ? x.amount / x.qty : 0).filter(Boolean);
  const group = key => { const g = {}; for (const x of r) { const k = key(x); (g[k] ||= { kg: 0, amount: 0, n: 0 }); g[k].kg += x.qty; g[k].amount += x.amount; g[k].n++; } return Object.entries(g).sort((a, b) => b[1].kg - a[1].kg); };
  const weeks = group(x => weekKey(x.date)).sort((a, b) => a[0].localeCompare(b[0])).map(([w, v]) => ({ w, avg: v.amount / v.kg, kg: v.kg }));
  return { n: r.length, qty, amount, avg: qty ? amount / qty : 0, min: prices.length ? Math.min(...prices) : 0, max: prices.length ? Math.max(...prices) : 0, traced, stock: qty - RECEP.sold,
    zones: group(x => x.zone), buyers: group(x => x.buyer || "—"), months: group(x => x.date.slice(0, 7)).sort((a, b) => a[0].localeCompare(b[0])), weeks };
}
const tBars = (list, total, cls = "") => { const max = Math.max(...list.map(x => x[1].kg), 1); return `<div class="bars">${list.map(([k, v]) => `<div class="bar-row" title="${esc(k)} : ${fkg(v.kg)}"><span class="lab">${esc(k)}</span><span class="bar-track"><span class="bar-fill ${cls}" style="width:${v.kg / max * 100}%"></span></span><span class="val">${(v.kg / 1000).toLocaleString(loc(), { maximumFractionDigits: 1 })} t<small>${Math.round(v.kg / (total || 1) * 100)} %</small></span></div>`).join("")}</div>`; };
function priceChart(weeks, avg) {
  const W = 760, H = 260, L = 56, R = 16, T = 16, B = 30;
  if (!weeks.length) return "";
  const vals = weeks.map(w => w.avg), lo = Math.floor((Math.min(...vals, avg) - 60) / 100) * 100, hi = Math.ceil((Math.max(...vals, avg) + 60) / 100) * 100;
  const X = i => L + (weeks.length === 1 ? (W - L - R) / 2 : i / (weeks.length - 1) * (W - L - R)), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi; v += 100) ticks.push(v);
  const path = weeks.map((w, i) => `${i ? "L" : "M"}${X(i)},${Y(w.avg)}`).join("");
  const every = Math.max(1, Math.ceil(weeks.length / 8));
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("price_trend"))}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fn(v)}</text>`).join("")}
    ${weeks.map((w, i) => i % every === 0 ? `<text class="axis" x="${X(i)}" y="${H - 8}" text-anchor="${i === weeks.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${dfmt(w.w)}</text>` : "").join("")}
    <line class="ceil" style="stroke:var(--pod)" x1="${L}" x2="${W - R}" y1="${Y(avg)}" y2="${Y(avg)}"/><text class="ceil-l" style="fill:var(--pod)" x="${W - R}" y="${Y(avg) - 6}" text-anchor="end">${esc(S.lang === "fr" ? "moyenne" : "average")} ${fn(avg)}</text>
    <path class="line" d="${path}"/>
    ${weeks.map((w, i) => `<circle class="dot" cx="${X(i)}" cy="${Y(w.avg)}" r="4"><title>${dfull(w.w)} : ${fn(w.avg)} F/kg · ${fkg(w.kg)}</title></circle>`).join("")}
  </svg></div>`;
}

/* ---------- shell ---------- */
const route = () => location.hash.replace(/^#/, "") || (isDG() ? "overview" : "mine");
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
function shell() {
  document.documentElement.lang = S.lang;
  $("#brandSub").textContent = t("sub");
  const r = route();
  const items = !S.role ? [] : isDG()
    ? [["overview", t("nav_overview")], ["inbox", t("nav_inbox"), dgPending().length + tresoWaiting().length], ["pdg", t("nav_pdg"), myPdg().filter(x => x.status === "info").length], ["recep", t("nav_recep")], ["treasury", t("nav_treasury")], ["trace", t("nav_trace")], ["team", t("nav_team")], ["apps", t("nav_apps")]]
    : [["mine", t("nav_mine"), S.dg.filter(x => x.status === "info").length], ["apps", t("nav_apps")]];
  $("#nav").innerHTML = items.map(([k, l, c]) => `<a href="#${k}" class="${r === k ? "on" : ""}">${esc(l)}${c ? `<span class="badge">${c}</span>` : ""}</a>`).join("");
  $("#railFoot").innerHTML = `${S.me ? `<span>${esc(S.role ? myName() : S.me.name)}${S.role ? `<br>${esc(isDG() ? t("rl_" + OFFICE) : `${t("r_staff")} · ${entName(S.staff.entity)}${S.staff.department ? " · " + S.staff.department : ""}`)}` : ""}</span>` : ""}
    <div class="row"><button class="btn small" id="langBtn">${esc(t("lang"))}</button>${S.me ? `<button class="btn small" id="outBtn">${esc(t("signout"))}</button>` : ""}</div>`;
  const ob = $("#outBtn"); if (ob) ob.onclick = async () => { await sb.auth.signOut(); S.me = null; S.role = null; render(); };
  try { localStorage.setItem("saic-lang", S.lang); } catch (e) {}
  $("#langBtn").onclick = () => { S.lang = S.lang === "fr" ? "en" : "fr"; render(); };
}
function render() {
  shell();
  const r = route(), m = $("#main");
  if (!S.ready) { m.innerHTML = `<div class="card">${esc(t("loading"))}</div>`; return; }
  if (!S.me) { m.innerHTML = viewLogin(); bindLogin(); return; }
  if (!S.role) { m.innerHTML = `<div class="notice">${esc(t("no_access"))}</div>`; return; }
  if (S.loadError) { m.innerHTML = `<div class="notice" style="background:var(--bad-bg);color:var(--bad)">${esc(t("load_err", { m: S.loadError }))}</div>`; return; }
  if (!isDG() && !["mine", "apps"].includes(r)) { location.hash = "mine"; return; }
  if (r === "mine") { m.innerHTML = viewMine(); bindFilters(); return; }
  if (r === "inbox") { m.innerHTML = viewInbox(); bindFilters(); return; }
  if (r === "pdg") { m.innerHTML = viewPdg(); bindFilters(); return; }
  if (r === "treasury") { m.innerHTML = viewTreasury(); bindChart(CB.cacao); bindChart(CB.admin); return; }
  if (r === "recep") { m.innerHTML = viewRecep(); return; }
  if (r === "trace") { m.innerHTML = viewTrace(); return; }
  if (r === "team") { m.innerHTML = viewTeam(); bindTeam(); return; }
  if (r === "apps") { m.innerHTML = viewApps(); return; }
  m.innerHTML = viewOverview();
}

function dgAlerts() {
  const out = [];
  const urg = dgPending().filter(r => r.urgency === "urgent").length; if (urg) out.push({ lv: "bad", m: t("al_urgent", { n: urg }), href: "#inbox" });
  for (const r of myPdg().filter(x => x.status === "info")) { const h = (r.history || []).slice(-1)[0]; out.push({ lv: "warn", m: t("al_info_pdg", { t: h && h.note ? h.note : r.title }), href: "#pdg" }); }
  const tw = tresoWaiting().length; if (tw) out.push({ lv: "warn", m: t("al_treso", { n: tw }), href: "#inbox" });
  return out.concat(alerts());
}
function deptRequestsFor(ent) {
  const l = S.dg.filter(r => r.entity === ent), by = {};
  for (const r of l) { const d = r.department || "—"; (by[d] ||= { pending: 0, info: 0, done: 0 }); if (r.status === "pending") by[d].pending++; else if (r.status === "info") by[d].info++; else by[d].done++; }
  const rows = Object.entries(by).sort((a, b) => b[1].pending - a[1].pending || a[0].localeCompare(b[0]));
  const pend = l.filter(r => r.status === "pending");
  return `<div class="card dept">
    <div class="box-head"><div><div class="ent">${esc(entName(ent))}</div><h2>${esc(t("dept_req", { e: entName(ent) }))}</h2></div>${statusPill(pend.some(r => r.urgency === "urgent") ? "bad" : pend.length ? "watch" : "ok")}</div>
    ${rows.length ? `<div class="who-row">${rows.map(([d, c]) => `<span>${esc(d)}</span><span class="n"><b>${c.pending}</b> ${esc(t("req_pending"))}</span><span class="n muted">${c.info ? `${c.info} ${esc(t("req_info"))} · ` : ""}${c.done} ${esc(S.lang === "fr" ? "traitée(s)" : "handled")}</span>`).join("")}</div>` : `<p class="muted">${esc(t("no_dept"))}</p>`}
    <div class="foot"><a href="#inbox" data-goent="${ent}">${esc(t("see_all"))}</a></div></div>`;
}

  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { S.flt.st = b.dataset.st; render(); });

let attNew = [];
async function signed(bucket, path) { const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 600); if (error || !data) { toast(t("save_err", { m: error ? error.message : "?" })); return null; } return data.signedUrl; }
function attachField() {
  attNew = [];
  return `<div class="f full"><span style="font-size:13px;font-weight:500">${esc(t("att"))}</span>
    <label class="btn small" style="align-self:flex-start"><input type="file" id="attIn" class="vh" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf">${esc(t("att_add"))}</label><span class="hint">${esc(t("att_hint"))}</span>
    <ul class="att-list" id="attList"></ul></div>`;
}
function bindAttach() {
  const draw = () => { const l = $("#attList"); if (!l) return; l.innerHTML = attNew.map((f, i) => `<li><span>${esc(f.name)}</span><button type="button" class="btn small" data-attn="${i}">${esc(t("att_remove"))}</button></li>`).join("");
    l.querySelectorAll("[data-attn]").forEach(b => b.onclick = () => { attNew.splice(+b.dataset.attn, 1); draw(); }); };
  const inp = $("#attIn"); if (inp) inp.onchange = () => { for (const f of inp.files) attNew.push(f); inp.value = ""; draw(); };
}
function toJpeg(file, max = 2000, q = 0.85) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("image")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error(t("att_type"))); }; img.src = u; });
}
async function uploadAttachments(bucket, errEl) {
  const out = [], folder = bucket === "dg-files" ? S.me.id : new Date().toISOString().slice(0, 7);
  for (const f of attNew) {
    try {
      let blob = f, type = f.type, name = f.name;
      if (/^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name)) { if (f.size > 1.5e6 || !/^image\/(jpeg|png|webp)$/.test(f.type)) { blob = await toJpeg(f); type = "image/jpeg"; name = name.replace(/\.\w+$/, "") + ".jpg"; } }
      else if (f.type !== "application/pdf") throw new Error(t("att_type"));
      if (blob.size > 20e6) throw new Error(t("att_hint"));
      errEl.textContent = t("uploading");
      const path = `${folder}/${crypto.randomUUID()}-${name.replace(/[^\w.\-]+/g, "_")}`;
      const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: type, upsert: false });
      if (error) throw new Error(error.message);
      out.push({ path, name, type, size: blob.size });
    } catch (e) { throw new Error(t("att_fail", { n: f.name, m: e.message || e.code })); }
  }
  errEl.textContent = "";
  return out;
}
async function copyFilesToPdg(files) {   // forwarding: the PDG can't read the DG's bucket, so the files are copied
  const out = [];
  for (const f of files || []) {
    const { data, error } = await sb.storage.from("dg-files").download(f.path); if (error) throw new Error(error.message);
    const path = `${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g, "_")}`;
    const up = await sb.storage.from("pdg-files").upload(path, data, { contentType: f.type, upsert: false }); if (up.error) throw new Error(up.error.message);
    out.push({ ...f, path });
  }
  return out;
}

    if (!title || !details) { $("#nfErr").textContent = t(toDg ? "need_dept" : "need_fields"); return; }
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    let files; try { files = attNew.length ? await uploadAttachments(toDg ? "dg-files" : "pdg-files", $("#nfErr")) : []; } catch (x) { $("#nfErr").textContent = x.message; btn.disabled = false; return; }
    const now = new Date().toISOString(), id = `${toDg ? (WHP ? "DGW" : "DG") : "PDG"}-${now.slice(0, 4)}-${String(Date.now()).slice(-6)}`;
    const base = { id, type: $("#ny").value, title, amount: Number($("#na").value) || 0, urgency: $("#nu").value, due: $("#nd").value || null, details, files };
    const { error } = toDg ? await sb.from("dg_requests").insert({ ...base, entity: $("#ne").value, department: $("#ndp").value.trim() })
                           : await sb.from("pdg_requests").insert({ ...base, from_role: OFFICE, ent: $("#ne").value });
    if (error) { $("#nfErr").textContent = t("save_err", { m: error.message }); btn.disabled = false; return; }
    closeModal(); toast(t(toDg ? "submitted_dg" : "submitted", { id })); await loadData();
  };
}
function forwardForm(id) {
  const r = S.dg.find(x => x.id === id);
  modal(`<form id="ff"><header><div><h2>${esc(t("fw_title"))}</h2><p>${esc(t("fw_sub"))}</p></div><button type="button" class="btn" data-close>${esc(t("close"))}</button></header>
    <div class="body"><div class="fgrid">
      <div class="f full"><label for="ft">${esc(t("f_title"))}</label><input id="ft" type="text" value="${esc(`[${entName(r.entity)}${r.department ? " · " + r.department : ""}] ${r.title}`)}"></div>
      <div class="f"><label for="fy">${esc(t("f_type"))}</label><select id="fy">${PDG_TYPES.map(k => `<option value="${k}" ${TO_PDG_TYPE[r.type] === k ? "selected" : ""}>${esc(t("t_" + k))}</option>`).join("")}</select></div>
      <div class="f"><label for="fa">${esc(t("f_amount"))}</label><input id="fa" type="number" min="0" step="1000" value="${r.amount || ""}"></div>
      <div class="f"><label for="fu">${esc(t("f_urgency"))}</label><select id="fu"><option value="normal">${esc(t("f_normal"))}</option><option value="urgent" ${r.urgency === "urgent" ? "selected" : ""}>${esc(t("f_urgent"))}</option></select></div>
      <div class="f"><label for="fd">${esc(t("f_due"))}</label><input id="fd" type="date" value="${esc(r.due || "")}"></div>
      <div class="f full"><label for="fo">${esc(t("fw_note"))}</label><textarea id="fo"></textarea></div>
    </div><p class="small muted">${esc(t("d_files"))} : ${(r.files || []).length}</p></div>
    <footer><span class="err" id="ffErr"></span><div class="row"><button type="button" class="btn" data-close>${esc(t("cancel"))}</button><button class="btn primary" type="submit">${esc(t("forward"))}</button></div></footer></form>`);
  $("#ff").onsubmit = async e => {
    e.preventDefault(); const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      $("#ffErr").textContent = (r.files || []).length ? t("uploading") : "";
      const files = await copyFilesToPdg(r.files);
      const opinion = $("#fo").value.trim(), pid = `PDG-${new Date().toISOString().slice(0, 4)}-${String(Date.now()).slice(-6)}`;
      const details = `${r.details}\n\n— ${t("fw_origin", { id: r.id, n: r.fromName || "—", e: entName(r.entity), d: r.department || "—" })}${opinion ? `\n— ${t("fw_opinion")} : ${opinion}` : ""}`;
      let x = await sb.from("pdg_requests").insert({ id: pid, from_role: OFFICE, ent: WHP ? "WHP" : "SAIC", type: $("#fy").value, title: $("#ft").value.trim() || r.title, amount: Number($("#fa").value) || 0, urgency: $("#fu").value, due: $("#fd").value || null, details, files });
      if (x.error) throw new Error(x.error.message);
      x = await sb.from("dg_requests").update({ status: "escalated", pdg_ref: pid, last_note: opinion || null }).eq("id", r.id);
      if (x.error) throw new Error(x.error.message);
      closeModal(); toast(t("fw_done", { id: pid })); await loadData();
    } catch (x) { $("#ffErr").textContent = t("save_err", { m: x.message }); btn.disabled = false; }
  };
}
function stepForm(table, id, action) {
  const list = table === "dg_requests" ? S.dg : S.requests, r = list.find(x => x.id === id);
  const cfg = { approve: [t("approve"), t("comment"), false, "approved"], reject: [t("reject"), t("reason"), true, "rejected"], info: [t("ask_info"), t("question"), true, "info"], reply: [t("reply"), t("answer"), true, "pending"] }[action];
  modal(`<form id="af"><header><div><h2>${esc(cfg[0])}</h2><p>${esc(r.title)}${r.amount ? " · " + fc(r.amount) : ""}</p></div><button type="button" class="btn" data-close>${esc(t("close"))}</button></header>
    <div class="body"><div class="f"><label for="ax">${esc(cfg[1])}</label><textarea id="ax"></textarea></div></div>
    <footer><span class="err" id="afErr"></span><div class="row"><button type="button" class="btn" data-close>${esc(t("cancel"))}</button><button class="btn primary" type="submit">${esc(t("confirm"))}</button></div></footer></form>`);
  $("#ax").focus();
  $("#af").onsubmit = async e => { e.preventDefault(); const note = $("#ax").value.trim(); if (cfg[2] && !note) { $("#afErr").textContent = cfg[1]; return; }
    const { error } = await sb.from(table).update({ status: cfg[3], last_note: note || null }).eq("id", id);
    if (error) { $("#afErr").textContent = t("save_err", { m: error.message }); return; }
    closeModal(); toast(t("saved")); await loadData(); };
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) { if (a.dataset.act === "newpdg") newRequestForm("pdg"); else if (a.dataset.act === "newdg") newRequestForm("dg"); else if (a.dataset.act === "reply") stepForm("pdg_requests", a.dataset.id, "reply"); return; }
  const d = e.target.closest("[data-dgact]");
  if (d) { if (d.dataset.dgact === "forward") forwardForm(d.dataset.id); else stepForm("dg_requests", d.dataset.id, d.dataset.dgact); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- login ---------- */
function viewLogin() {
  return `<div class="card stack" style="max-width:400px;margin:8vh auto 0;width:100%">
    <div><img src="${BRAND}" alt="${WHP ? "Wenkam Holdings Plus" : "SAIC"}" style="width:220px;max-width:100%;display:block;margin:0 auto 10px"><h1 style="margin-top:8px">${esc(t("signin"))}</h1><p class="muted">${esc(t("signin_sub"))}</p></div>
    <form id="lf" class="stack" novalidate>
      <div class="f"><label for="lem">${esc(t("email"))}</label><input id="lem" type="email" autocomplete="username" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px"></div>
      <div class="f"><label for="lpw">${esc(t("password"))}</label><input id="lpw" type="password" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px"></div>
      <span class="err" id="lErr"></span><button class="btn primary" type="submit" id="lBtn">${esc(t("signin_btn"))}</button><a href="#" id="lForgot">${esc(t("forgot"))}</a></form></div>`;
}
function bindLogin() {
  $("#lf").onsubmit = async e => { e.preventDefault(); $("#lBtn").disabled = true; $("#lErr").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
    if (error) { $("#lErr").textContent = /invalid/i.test(error.message) ? t("bad_login") : error.message; $("#lBtn").disabled = false; return; }
    await boot(); };
  $("#lForgot").onclick = async e => { e.preventDefault(); const em = $("#lem").value.trim(); if (!em) { $("#lErr").textContent = t("enter_email"); return; }
    await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + (WHP ? "/dg-whp/" : "/dg-saic/") }); $("#lErr").textContent = t("reset_sent"); };
}

/* ---------- data from Supabase ---------- */
const mapDg = r => ({ id: r.id, entity: r.entity, department: r.department || "", fromUser: r.from_user, fromName: r.from_name, type: r.type, title: r.title, amount: Number(r.amount), urgency: r.urgency, due: r.due || "",
  details: r.details, files: r.files || [], status: r.status, pdgRef: r.pdg_ref, example: r.example, created: r.created_at, history: r.history || [] });
async function loadData() {
  try {
    const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
    S.dg = (await sb.from("dg_requests").select("*").order("created_at", { ascending: false }).then(must)).map(mapDg).filter(r => ENTS.includes(r.entity));
    if (isDG()) {
      const [reqs, fund, team, people, boxes, tx, farmers] = await Promise.all([
        sb.from("pdg_requests").select("*").eq("from_role", OFFICE).order("created_at", { ascending: false }).then(must),
        sb.from("fund_requests").select("id, caisse, type, amount, reason, flow, status, created_at").then(r => r.error ? [] : r.data),
        sb.from("saic_staff").select("*").then(must),
        sb.from("profiles").select("id, full_name").then(must),
        sb.from("cash_boxes").select("*").then(must),
        sb.from("cash_transactions").select("caisse, kind, date, ref, party, cat, amount, seq").eq("voided", false).order("date").order("seq").limit(20000).then(must),
        sb.from("farmers").select("id, name, village, decision, id_number, archived, plots(area, lat, lon, polygon, defo_date, defo_evidence)").eq("archived", false).limit(10000).then(must)
      ]);
      S.requests = reqs.map(r => ({ id: r.id, from: r.from_role, ent: r.ent, type: r.type, title: r.title, amount: Number(r.amount), urgency: r.urgency, due: r.due || "", details: r.details,
        files: r.files || [], status: r.status, example: r.example, created: r.created_at, history: r.history || [] }));
      S.fund = fund.map(f => ({ ...f, amount: Number(f.amount) }));
      S.people = people.map(p => ({ id: p.id, name: p.full_name || p.id.slice(0, 8) })).sort((a, b) => a.name.localeCompare(b.name));
      S.team = team.map(s => ({ ...s, name: (S.people.find(p => p.id === s.user_id) || {}).name || "—" }));
      const [recs, sales] = await Promise.all([
        sb.from("cocoa_receptions").select("date, zone, buyer, qty, amount, lines").limit(20000).then(r => r.error ? [] : r.data),
        sb.from("cocoa_sales").select("qty").then(r => r.error ? [] : r.data)]);
      RECEP = { recs: recs.map(x => ({ ...x, qty: Number(x.qty), amount: Number(x.amount) })), sold: sales.reduce((a, x) => a + Number(x.qty), 0) };
      const nd = {};
      for (const b of boxes) {
        CEILINGS[b.id] = Number(b.ceiling);
        const rows = tx.filter(r => r.caisse === b.id).map(r => ({ date: r.date, ref: r.ref || "", party: r.party || "", cat: r.cat, out: r.kind === "out" ? Number(r.amount) : 0, in: r.kind === "in" ? Number(r.amount) : 0 }));
        nd[b.id] = { opening: Number(b.opening), from: b.start_date, to: rows.reduce((m, r) => r.date > m ? r.date : m, b.start_date), rows };
      }
      CASH = { ...CASH, ...nd };
      FARMERS = farmers.map(f => ({ id: f.id, name: f.name, village: f.village || "", decision: f.decision || "", idNumber: f.id_number || "",
        plots: (f.plots || []).map(p => ({ area: p.area, lat: p.lat, lon: p.lon, polygon: p.polygon, defoDate: p.defo_date, defoEvidence: p.defo_evidence })) }));
    }
    S.loadError = "";
  } catch (e) { S.loadError = e.message; }
  recompute(); render();
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; S.ready = true; render(); return; }
  const user = session.user;
  const [{ data: prof }, { data: mem }, { data: st }, { data: tm }] = await Promise.all([
    sb.from("profiles").select("full_name, role").eq("id", user.id).maybeSingle(),
    sb.from("exec_members").select("role").eq("user_id", user.id),
    sb.from("saic_staff").select("entity, department, title, active").eq("user_id", user.id).maybeSingle(),
    sb.from("treasury_members").select("role").eq("user_id", user.id).maybeSingle()]);
  S.me = { id: user.id, name: (prof && prof.full_name) || user.email };
  if ((mem || []).some(m => m.role === OFFICE)) S.role = "dg";
  else if (st && st.active && ENTS.includes(st.entity)) { S.role = "staff"; S.staff = { entity: st.entity, department: st.department, title: st.title, fixed: true }; }
  else if (!WHP && !(st && st.active) && !(mem || []).some(m => ["dg_saic", "dg_whp"].includes(m.role)) && ((prof && ["lead", "warehouse"].includes(prof.role)) || tm)) { S.role = "staff"; S.staff = { entity: "cacao", department: prof && prof.role === "lead" ? "Traçabilité" : prof && prof.role === "warehouse" ? "Magasin" : tm ? "Comptabilité" : "", fixed: true }; }
  else S.role = null;
  S.ready = true;
  if (S.role === "staff" && !["mine", "apps"].includes(route())) location.hash = "mine";
  if (S.role) await loadData(); else render();
}
recompute(); render(); boot();

</script>
