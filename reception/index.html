<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme.js"></script>
<title>SAIC Réception cacao</title>
<meta name="theme-color" content="#1f5c47">
<link rel="icon" href="../icons/saic-favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/saic-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout: same shell as the SAIC farmer registry — left rail + work area; cash box page = tiles, balance chart | categories, table. */
:root{
  --paper:#f3f5f2; --surface:#ffffff; --ink:#1b2420; --muted:#5d6a63; --line:#d9dfd9;
  --accent:#1f5c47; --accent-soft:#e2eee8; --pod:#a8641a; --pod-soft:#f6ead9;
  --ok:#237a4b; --ok-bg:#e1f2e7; --warn:#9a6400; --warn-bg:#fbf0d9; --bad:#b3362c; --bad-bg:#fbe4e1;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
    --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
    --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa79f; --line:#2c3531;
  --accent:#6cc39c; --accent-soft:#1e3229; --pod:#e0a35a; --pod-soft:#33270f;
  --ok:#6fd39a; --ok-bg:#16301f; --warn:#e6b45a; --warn-bg:#33270f; --bad:#f08a7f; --bad-bg:#3a1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px;font-weight:700} h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.9em} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.logo{display:block;width:180px;max-width:100%;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--paper)} .nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{background:var(--warn-bg);color:var(--warn);border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.rail-foot select{font-size:13px;padding:5px 8px}
.main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.topline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topline p{margin-top:4px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);font-size:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .l{font-size:13px;color:var(--muted)} .tile .s{font-size:12px;color:var(--muted)}
.v.ok{color:var(--ok)} .v.bad{color:var(--bad)} .v.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

/* cash box summary cards */
.box{display:flex;flex-direction:column;gap:12px}
.box-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.box-head .code{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.bal{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.bal small{font-size:15px;color:var(--muted);font-weight:500}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--paper);overflow:visible}
.gauge span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.gauge span.over{background:var(--bad)} .gauge span.low{background:var(--warn)}
.gauge i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gauge-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.kv3 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--accent-soft);color:var(--muted)}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:6px;border-left:3px solid}
.issues li.bad{background:var(--bad-bg);border-color:var(--bad)} .issues li.warn{background:var(--warn-bg);border-color:var(--warn)} .issues li.ok{background:var(--ok-bg);border-color:var(--ok)}
.issues li .who{font-size:12px;color:var(--muted);display:block}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--paper);border-radius:0 4px 4px 0;position:relative}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar-fill.pod{background:var(--pod)}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row .val small{color:var(--muted);margin-left:6px}
.bar-row:hover .bar-fill{filter:brightness(1.12)}

/* chart */
.chart-wrap{position:relative}
svg.chart{width:100%;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);fill-opacity:.08}
.chart .ceil{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ceil-l{fill:var(--bad);font-size:13px;font-weight:600}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.toolbar select{width:auto}
textarea{min-height:70px;resize:vertical}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap;font-size:12px}
td.in{color:var(--ok)}
tr.flag-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)} tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.flagtxt{font-size:12px;display:block;margin-top:2px} .flagtxt.bad{color:var(--bad)} .flagtxt.warn{color:var(--warn)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

/* requests */
.req{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.req .amt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.steps{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.step{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.step.now{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.step.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.req .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--pod-soft);color:var(--pod);text-transform:uppercase;letter-spacing:.04em}
.recon{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;align-items:center}
.recon .num{text-align:right}
.recon input{width:160px;text-align:right}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.drawer form{display:flex;flex-direction:column;min-height:100%}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.drawer header p{margin-top:2px;color:var(--muted);font-size:13px}
.drawer .body{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0} .f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.att-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.att-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.att-links{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.suggest{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:10px 12px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40}

@media (max-width:1050px){ .grid2,.grid-wide{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{width:120px} .brand span{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail-foot{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .main{padding:18px 16px 50px}
  .fgrid{grid-template-columns:1fr}
  .kv3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Reception dashboard additions — same SAIC shell; overview = KPI row, price trend | zones, buyers | traceability. */
fieldset{border:none;margin:0;padding:0;min-width:0}
input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.b-ok{background:var(--ok)} .b-pod{background:var(--pod)} .b-acc{background:var(--accent)} .b-bad{background:var(--bad)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 120px auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px}
.line .who{font-size:12px;color:var(--muted);margin-top:3px}
.line .who.bad{color:var(--bad)} .line .who.ok{color:var(--ok)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--paper);border-radius:8px;padding:10px 12px;font-size:13px}
.calc b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
.chip.r{background:var(--pod-soft);color:var(--pod)}
@media (max-width:760px){ .line{grid-template-columns:1fr} .calc{grid-template-columns:1fr 1fr} }
</style>

</div>

<div id="toastHost"></div>

const S = { lang: (() => { try { const l = localStorage.getItem("saic-lang"); if (l === "en" || l === "fr") return l; } catch (e) {} return (navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr"; })(), role: null, appRole: null, me: null, ready: false, loadError: "", recs: [], edits: [], db: null, assets: null, flt: { q: "", zone: "", kind: "", month: "", untraced: false }, fq: "", farmer: null };
const t = (k, p = {}) => String((STR[S.lang][k] ?? STR.fr[k] ?? k)).replace(/\{(\w+)\}/g, (_, x) => p[x] ?? "");
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const loc = () => S.lang === "fr" ? "fr-FR" : "en-GB";
const fc = n => Math.round(n).toLocaleString(loc()).replace(/ /g, " ") + " F";
const fn = (n, d = 0) => Number(n).toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ /g, " ");
const fkg = n => fn(n) + " kg";
const ft = n => n >= 1000 ? fn(n / 1000, 1) + " t" : fkg(n);
const fcs = n => { const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toLocaleString(loc(), { maximumFractionDigits: 1 }) + " M" : a >= 1e3 ? Math.round(n / 1e3).toLocaleString(loc()) + " k" : Math.round(n).toLocaleString(loc()); };
const dfmt = iso => new Date(iso + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short" });
const dfull = iso => new Date(iso + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" });
function toast(m) { $("#toastHost").innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("#toastHost").innerHTML = "", 3000); }
const canEdit = () => S.role === "magasin";  // set for the Traceability Lead and the Warehouse Manager

/* ---------- registry lookup ---------- */
const farmerStatus = f => f.decision === "Approved" ? "verified" : (!f.idNumber || (f.plots || []).some(p => !p.defoDate || !p.defoEvidence)) ? "hold" : "pending";
let FMAP = {};
const findFarmer = id => FMAP[String(id || "").trim().toUpperCase()];

/* ---------- receptions = imported lines + app entries/edits ---------- */
function receptions() {
  const list = S.recs;
  return list.map(r => ({ ...r, amount: r.amount ?? (r.qty || 0) * (r.price || 0), lines: r.lines || [] })).sort((a, b) => a.date === b.date ? a.no - b.no : a.date.localeCompare(b.date));
}
const weekKey = iso => { const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); };
function stats(list) {
  list = list.filter(r => !r.example);
  const qty = list.reduce((a, r) => a + (r.qty || 0), 0), amount = list.reduce((a, r) => a + (r.amount || 0), 0);
  const received = list.reduce((a, r) => a + (r.received || 0), 0);
  const traced = list.reduce((a, r) => a + r.lines.reduce((s, l) => s + (Number(l.kg) || 0), 0), 0);
  const prices = list.map(r => r.price).filter(Boolean);
  const group = key => { const g = {}; for (const r of list) { const k = key(r); (g[k] ||= { kg: 0, amount: 0, n: 0, buyers: new Set() }); g[k].kg += r.qty || 0; g[k].amount += r.amount || 0; g[k].n++; g[k].buyers.add(r.buyer); } return Object.entries(g).sort((a, b) => b[1].kg - a[1].kg); };
  const weeks = group(r => weekKey(r.date)).sort((a, b) => a[0].localeCompare(b[0])).map(([w, v]) => ({ w, avg: v.amount / v.kg, kg: v.kg }));
  return { qty, amount, received, traced, avg: qty ? amount / qty : 0, min: Math.min(...prices), max: Math.max(...prices), zones: group(r => r.zone), buyers: group(r => r.buyer), kinds: group(r => r.kind), weeks, n: list.length };
}

/* ---------- control points ---------- */
function controls(list) {
  list = list.filter(r => !r.example);
  const out = [];
  const unt = list.filter(r => !r.lines.length);
  if (unt.length) out.push({ lv: "bad", m: t("ct_untraced", { n: unt.length, kg: fn(unt.reduce((a, r) => a + (r.qty || 0), 0)) }) });
  const hold = list.reduce((a, r) => a + r.lines.filter(l => { const f = findFarmer(l.farmer); return f && farmerStatus(f) === "hold"; }).reduce((s, l) => s + (Number(l.kg) || 0), 0), 0);
  if (hold) out.push({ lv: "bad", m: t("ct_hold", { n: fn(hold) }) });
  const nor = list.filter(r => !r.received);
  if (nor.length) out.push({ lv: "warn", m: t("ct_noreceived", { n: nor.length }) });
  const cnt = {}; for (const r of list) cnt[r.no] = (cnt[r.no] || 0) + 1;
  for (const [no, n] of Object.entries(cnt)) if (n > 1) out.push({ lv: "warn", m: t("ct_dupno", { no, n }) });
  const loss = list.filter(r => (r.loss || 0) > 0);
  if (loss.length) out.push({ lv: "warn", m: t("ct_loss", { kg: fn(loss.reduce((a, r) => a + r.loss, 0)), n: loss.length }) });
  const wk = Object.fromEntries(stats(list).weeks.map(w => [w.w, w.avg]));
  for (const r of list) { const a = wk[weekKey(r.date)]; if (r.price && a && Math.abs(r.price - a) / a > 0.10) out.push({ lv: "warn", m: t("ct_price", { no: r.no, p: fn(r.price), a: fn(a) }) }); }
  for (const r of list) { const c = (r.qty || 0) * (r.price || 0); if (r.amount && Math.abs(r.amount - c) > 1) out.push({ lv: "warn", m: t("ct_amount", { no: r.no, m: fc(r.amount), c: fc(c) }) }); }
  // reconciliation with the cocoa cash box (store purchases paid in cash)
  const cash = CASH_COCOA.slice(); let ok = 0;
  for (const r of list.filter(r => r.date >= "2026-10-01" && r.date <= "2026-10-31")) {
    const near = cash.filter(c => Math.abs(new Date(c.date) - new Date(r.date)) <= 3 * 864e5);
    const same = near.find(c => Math.round(c.out) === Math.round(r.amount));
    if (same) { ok++; cash.splice(cash.indexOf(same), 1); continue; }
    const close = near.filter(c => Math.abs(c.out - r.amount) / r.amount < 0.01).sort((a, b) => Math.abs(a.out - r.amount) - Math.abs(b.out - r.amount))[0];
    if (close) { out.push({ lv: "warn", m: t("ct_cash", { no: r.no, d: dfmt(r.date), m: fc(r.amount), c: fc(close.out), x: fc(close.out - r.amount) }) }); cash.splice(cash.indexOf(close), 1); }
  }
  if (ok) out.push({ lv: "ok", m: t("ct_cash_ok", { n: ok }) });
  return out.sort((a, b) => ({ bad: 0, warn: 1, ok: 2 }[a.lv] - { bad: 0, warn: 1, ok: 2 }[b.lv]));
}

/* ---------- charts ---------- */
function bars(list, total, opt = {}) {
  const max = Math.max(...list.map(x => x[1]), 1);
  return `<div class="bars">${list.map(([k, v, extra]) => `<div class="bar-row" title="${esc(k)} : ${fkg(v)}"><span class="lab">${esc(k)}</span><span class="bar-track"><span class="bar-fill ${opt.cls || ""}" style="width:${v / max * 100}%"></span></span><span class="val">${ft(v)}<small>${extra ?? Math.round(v / total * 100) + " %"}</small></span></div>`).join("")}</div>`;
}
function priceChart(weeks, avg) {
  const W = 760, H = 260, L = 56, R = 16, T = 16, B = 30;
  if (!weeks.length) return "";
  const vals = weeks.map(w => w.avg), lo = Math.floor((Math.min(...vals, avg) - 60) / 100) * 100, hi = Math.ceil((Math.max(...vals, avg) + 60) / 100) * 100;
  const X = i => L + (weeks.length === 1 ? (W - L - R) / 2 : i / (weeks.length - 1) * (W - L - R)), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi; v += 100) ticks.push(v);
  const path = weeks.map((w, i) => `${i ? "L" : "M"}${X(i)},${Y(w.avg)}`).join("");
  const every = Math.max(1, Math.ceil(weeks.length / 8));
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("price_trend"))}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fn(v)}</text>`).join("")}
    ${weeks.map((w, i) => i % every === 0 ? `<text class="axis" x="${X(i)}" y="${H - 8}" text-anchor="${i === weeks.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${dfmt(w.w)}</text>` : "").join("")}
    <line class="ceil" style="stroke:var(--pod)" x1="${L}" x2="${W - R}" y1="${Y(avg)}" y2="${Y(avg)}"/><text class="ceil-l" style="fill:var(--pod)" x="${W - R}" y="${Y(avg) - 6}" text-anchor="end">${esc(S.lang === "fr" ? "moyenne" : "average")} ${fn(avg)}</text>
    <path class="line" d="${path}"/>
    ${weeks.map((w, i) => `<circle class="dot" cx="${X(i)}" cy="${Y(w.avg)}" r="4"><title>${dfull(w.w)} : ${fn(w.avg)} F/kg · ${fkg(w.kg)}</title></circle>`).join("")}
  </svg></div>`;
}

  m.innerHTML = note + viewOverview();
}

    if (ro) $("#lines").querySelectorAll("input,select,button").forEach(x => x.disabled = true);
    $("#lines").querySelectorAll("[data-line]").forEach(row => { const i = +row.dataset.line;
      row.querySelectorAll("[data-k]").forEach(inp => inp.onchange = () => { lines[i][inp.dataset.k] = inp.value.trim(); if (inp.dataset.k === "farmer") { lines[i].farmer = inp.value.trim().toUpperCase(); lines[i].plot = ""; drawLines(); } else sum(); });
      row.querySelector("[data-k=kg]").oninput = e => { lines[i].kg = e.target.value; sum(); }; });
    $("#lines").querySelectorAll("[data-rmline]").forEach(b => b.onclick = () => { lines.splice(+b.dataset.rmline, 1); drawLines(); });
    sum();
  };
  const drawAtt = () => { const l = $("#attList"); l.innerHTML = [...attKeep.map((f, i) => `<li><a href="#" data-file="${esc(f.path)}">${esc(f.name)}</a>${ro ? "" : `<button type="button" class="btn small" data-attk="${i}">${esc(t("att_remove"))}</button>`}</li>`), ...attNew.map((f, i) => `<li><span>${esc(f.name)}</span><button type="button" class="btn small" data-attn="${i}">${esc(t("att_remove"))}</button></li>`)].join("");
    l.querySelectorAll("[data-attk]").forEach(b => b.onclick = () => { attKeep.splice(+b.dataset.attk, 1); drawAtt(); }); l.querySelectorAll("[data-attn]").forEach(b => b.onclick = () => { attNew.splice(+b.dataset.attn, 1); drawAtt(); }); };
  const inp = $("#attIn"); if (inp) inp.onchange = () => { for (const f of inp.files) attNew.push(f); inp.value = ""; drawAtt(); };
  ["fqty", "fprice", "frec"].forEach(i => $("#" + i).oninput = calc);
  $("#fkind").onchange = e => { if (e.target.value === "magasin" && !$("#fbuyer").value) $("#fbuyer").value = "Achat magasin"; };
  const add = $("#addLine"); if (add) add.onclick = () => { lines.push({ farmer: "", plot: "", kg: lines.length ? "" : ($("#fqty").value || "") }); drawLines(); $("#lf" + (lines.length - 1)).focus(); };
  calc(); drawLines(); drawAtt();
  $("#rf").onsubmit = async e => {
    e.preventDefault();
    const q = num("fqty"), p = num("fprice"), zone = $("#fzone").value.trim(), date = $("#fdate").value;
    if (!date || !zone || !(q > 0) || !(p > 0)) { $("#rfErr").textContent = t("need"); return; }
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    let files = attKeep.slice();
    try { for (const f of attNew) { if (!/^image\/|application\/pdf/.test(f.type)) throw new Error(t("att_type"));
      const path = `${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g, "_")}`;
      const { error } = await sb.storage.from("reception-files").upload(path, f, { contentType: f.type, upsert: false }); if (error) throw new Error(error.message);
      files.push({ path, name: f.name, type: f.type }); } }
    catch (x) { $("#rfErr").textContent = t("att_fail", { n: "", m: x.message || x.code }); btn.disabled = false; return; }
    const rc = num("frec");
    const rec = { ...(ex || {}), id: ex ? ex.id : null, no: num("fno") || nextNo, date, zone, kind: $("#fkind").value, buyer: $("#fbuyer").value.trim() || "Achat magasin", market: $("#fmarket").value.trim(),
      qty: q, price: p, amount: q * p, received: rc, bonus: rc != null ? Math.max(0, rc - q) : null, loss: rc != null ? Math.max(0, q - rc) : null,
      bags: num("fbags"), humidity: num("fhum"), grade: $("#fgrade").value, slip: $("#fslip").value.trim(), vehicle: $("#fveh").value.trim(), obs: $("#fobs").value.trim(),
      lines: lines.filter(l => l.farmer && Number(l.kg) > 0).map(l => ({ farmer: l.farmer.toUpperCase(), plot: l.plot || "", kg: Number(l.kg) })), files, updated: new Date().toISOString() };
    const body = { no: rec.no, date: rec.date, zone: rec.zone, kind: rec.kind, buyer: rec.buyer, market: rec.market || null, qty: rec.qty, price: rec.price, received: rec.received,
      bags: rec.bags, humidity: rec.humidity, grade: rec.grade || null, slip: rec.slip || null, vehicle: rec.vehicle || null, obs: rec.obs || null, lines: rec.lines, files: rec.files };
    const { error } = ex ? await sb.from("cocoa_receptions").update(body).eq("id", ex.id) : await sb.from("cocoa_receptions").insert(body);
    if (error) { $("#rfErr").textContent = t("save_err", { m: error.message }); btn.disabled = false; return; }
    closeModal(); await loadData(); toast(t("saved", { n: rec.no }));
  };
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && b.dataset.act === "new") { if (!canEdit()) { toast(t("only_wh")); return; } openForm(); return; }
  const rec = e.target.closest("[data-rec]"); if (rec) { openForm(rec.dataset.rec); return; }
  const fa = e.target.closest("[data-farmer]"); if (fa) { location.hash = "farmer-" + fa.dataset.farmer; return; }
  const z = e.target.closest("[data-zone]"); if (z) { S.flt = { ...S.flt, zone: z.dataset.zone }; location.hash = "receptions"; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); const r = e.target.closest && e.target.closest("[data-rec]"); if (r && e.key === "Enter") openForm(r.dataset.rec); });

/* ---------- login ---------- */
function viewLogin() {
  return `<div class="card stack" style="max-width:400px;margin:8vh auto 0;width:100%"><img src="${LOGO}" alt="SAIC" style="width:240px;max-width:100%;margin:0 auto 6px;display:block">
    <div><h1>${esc(t("signin"))}</h1><p class="muted">${esc(t("signin_sub"))}</p></div>
    <form id="lf" class="stack" novalidate>
      <div class="f"><label for="lem">${esc(t("email"))}</label><input id="lem" type="email" autocomplete="username"></div>
      <div class="f"><label for="lpw">${esc(t("password"))}</label><input id="lpw" type="password" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px"></div>
      <span class="err" id="lErr"></span><button class="btn primary" type="submit" id="lBtn">${esc(t("signin_btn"))}</button><a href="#" id="lForgot">${esc(t("forgot"))}</a></form></div>`;
}
function bindLogin() {
  $("#lf").onsubmit = async e => { e.preventDefault(); $("#lBtn").disabled = true; $("#lErr").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
    if (error) { $("#lErr").textContent = /invalid/i.test(error.message) ? t("bad_login") : error.message; $("#lBtn").disabled = false; return; }
    await boot(); };
  $("#lForgot").onclick = async e => { e.preventDefault(); const em = $("#lem").value.trim(); if (!em) { $("#lErr").textContent = t("enter_email"); return; }
    await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + "/" }); $("#lErr").textContent = t("reset_sent"); };
}

/* ---------- data from Supabase ---------- */
async function loadData() {
  try {
    const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
    const [recs, sales, farmers] = await Promise.all([
      sb.from("cocoa_receptions").select("*").order("date").order("no").limit(20000).then(must),
      sb.from("cocoa_sales").select("*").order("date").then(must),
      sb.from("farmers").select("id, name, village, decision, id_number, archived, plots(pid, area, defo_date, defo_evidence)").limit(20000).then(must)
    ]);
    S.recs = recs.map(r => ({ id: r.id, no: r.no, date: r.date, market: r.market || "", zone: r.zone, kind: r.kind, buyer: r.buyer || "", qty: Number(r.qty), price: Number(r.price), amount: Number(r.amount),
      received: r.received === null ? null : Number(r.received), bonus: r.bonus === null ? null : Number(r.bonus), loss: r.loss === null ? null : Number(r.loss), bags: r.bags, humidity: r.humidity, grade: r.grade || "",
      slip: r.slip || "", vehicle: r.vehicle || "", obs: r.obs || "", lines: r.lines || [], files: r.files || [], imported: r.source === "import" }));
    DATA = { purchases: S.recs, sales: sales.map(x => ({ date: x.date, client: x.client, escort: x.escort || "", qty: Number(x.qty), bags: x.bags, price: x.price, received: x.received === null ? null : Number(x.received), amount: x.amount, status: x.status })) };
    FARMERS = farmers.map(f => ({ id: f.id, name: f.name, village: f.village || "", decision: f.decision || "", idNumber: f.id_number || "", archived: f.archived,
      plots: (f.plots || []).map(p => ({ pid: p.pid, area: p.area, defoDate: p.defo_date, defoEvidence: p.defo_evidence })).sort((a, b) => a.pid.localeCompare(b.pid)) })).filter(f => !f.archived);
    FMAP = Object.fromEntries(FARMERS.map(f => [f.id.toUpperCase(), f]));
    // optional: cocoa cash box payments, for the reconciliation (only if this account can read the treasury)
    const cash = await sb.from("cash_transactions").select("date, amount, cat, kind").eq("caisse", "cacao").eq("kind", "out").eq("voided", false);
    CASH_COCOA = cash.error ? [] : cash.data.filter(c => /achat de cacao/i.test(c.cat)).map(c => ({ date: c.date, out: Number(c.amount) }));
    S.loadError = "";
  } catch (e) { S.loadError = e.message; }
  render();
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; S.ready = true; render(); return; }
  const user = session.user;
  const [{ data: prof }, { data: ex }] = await Promise.all([
    sb.from("profiles").select("full_name, role").eq("id", user.id).maybeSingle(),
    sb.from("exec_members").select("role").eq("user_id", user.id).maybeSingle()]);
  S.me = { id: user.id, name: (prof && prof.full_name) || user.email };
  const ar = prof && prof.role;
  S.appRole = ar && ar !== "viewer" ? ar : ex && ex.role === "pdg" ? "pdg" : ar || null;
  S.role = ar === "lead" || ar === "warehouse" ? "magasin" : S.appRole ? "view" : null;
  S.ready = true;
  if (S.role) await loadData(); else render();
}
render(); boot();
</script>
